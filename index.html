e-habit:hover{background:#d9a441;color:#000}.btn-edit{background:rgba(0,0,0,.45);color:#7fdb7f;border:1px solid #7fdb7f;padding:3px 6px;border-radius:5px;cursor:pointer;font-size:8px;font-weight:600}.btn-edit:hover{background:#5f5;color:#000}.btn-delete{background:rgba(0,0,0,.45);color:#ff8585;border:1px solid #ff8585;padding:3px 5px;border-radius:5px;cursor:pointer;font-size:8px;font-weight:600}.btn-delete:hover{background:#f55;color:#fff}.btn-overflow-more{display:block;width:100%;background:var(--card-bg);color:var(--text-main);border:1px solid var(--border-color);border-radius:6px;padding:6px;font-size:10px;text-align:center;cursor:pointer;margin-top:5px}.btn-overflow-more:hover{background:var(--border-color)}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(10,10,9,.75);z-index:1000;justify-content:center;align-items:center;padding:10px;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s ease}.modal-overlay.active{opacity:1;visibility:visible}.modal-card{background:var(--card-bg);border:1px solid var(--border-color);width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;padding:20px;border-radius:12px;box-shadow:var(--shadow-md);position:relative;transform:scale(.92);transition:transform .25s cubic-bezier(.175,.885,.32,1.275)}.modal-overlay.active .modal-card{transform:scale(1)}.modal-header{font-size:15px;font-weight:500;color:var(--text-main);border-bottom:1px solid var(--border-color);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.modal-scroll-body{overflow-y:auto;max-height:calc(80vh - 60px);padding-right:4px}.modal-close{background:none;border:none;color:var(--muted-gray);font-size:19px;cursor:pointer;line-height:1}.modal-close:hover{color:#ff8585}.modal-body p{margin:7px 0;font-size:12px;white-space:pre-wrap}.modal-body strong{color:var(--muted-gray);font-size:10px;display:block}.editable-pill-container{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.editable-pill{background:#2b2d31;border:1px solid #383a40;color:#f2f3f5;font-size:9px;padding:2px 7px;border-radius:10px;display:inline-flex;align-items:center;gap:5px}.editable-pill .remove-pill{cursor:pointer;color:#ed4245;font-weight:700;font-size:10px}.editable-pill .remove-pill:hover{color:#ff6b6b}#authOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(20,20,19,.96);z-index:9999;display:flex;justify-content:center;align-items:center;padding:16px}.auth-box{background:var(--card-bg);border:1px solid var(--border-color);width:100%;max-width:380px;padding:28px;border-radius:14px;box-shadow:var(--shadow-md);text-align:center}.auth-box h3{color:var(--text-main);font-size:18px;font-weight:500;letter-spacing:1.5px;margin:12px 0 16px}#authErrorMsg{font-size:11px;color:#ff8585;margin-top:8px;min-height:15px}.footer-tag{text-align:center;font-size:12px;font-style:italic;color:var(--muted-gray);margin-top:8px;border-top:1px solid var(--border-color);padding-top:10px;letter-spacing:1px}.drag-handle{cursor:grab;user-select:none;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:16px;color:var(--muted-gray)}.drag-handle:active{cursor:grabbing}</style></head><body>

<div id="authOverlay" style="display:none"><div class="auth-box"><svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" style="width:50px;height:25px;margin:0 auto 10px;display:block"><circle cx="100" cy="50" r="38" fill="none" stroke="#fff" stroke-width="8"/><path d="M100 18Q112 50 100 82Q88 50 100 18Z" fill="#fff"/><path d="M20 50Q60 20 90 32L90 68Q60 80 20 50Z" fill="#fff"/><path d="M180 50Q140 20 110 32L110 68Q140 80 180 50Z" fill="#fff"/></svg><h3>SYSTEM ACCESS</h3><div class="form-group" style="text-align:left"><label>Email Address</label><input type="email" id="authEmail" placeholder="your@email.com"></div><div class="form-group" style="text-align:left;margin-bottom:12px"><label>Password</label><input type="password" id="authPassword" placeholder="••••••••"></div><button class="btn-submit" style="width:100%;padding:10px" onclick="handleLogin()">Sign In to Vault</button><div id="authErrorMsg"></div></div></div>

<div class="container"><div class="yorushika-header desktop-full-span"><div class="header-actions-right"><button class="btn-ics" onclick="exportFullICS()" title="Export .ics Calendar">.ICS</button> <button class="btn-logout" onclick="handleLogout()">Logout</button></div><svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="50" r="38" fill="none" stroke="#fff" stroke-width="8"/><path d="M100 18Q112 50 100 82Q88 50 100 18Z" fill="#fff"/><path d="M20 50Q60 20 90 32L90 68Q60 80 20 50Z" fill="#fff"/><path d="M180 50Q140 20 110 32L110 68Q140 80 180 50Z" fill="#fff"/></svg><p class="jp-title-logo">ヨルシカ</p><span class="sub-tag">Music & Schedule Archive</span></div>

<div class="desktop-calendar-column"><h2>Calendar</h2><div class="calendar-nav"><button onclick="changeMonth(-1)">◀</button><h3 id="monthYearDisplay"></h3><div class="calendar-nav-actions"><button class="btn-today-kalender" onclick="jumpToCurrentMonth()">Today</button> <button onclick="changeMonth(1)">▶</button></div></div><div class="weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days-grid" id="daysGrid"></div></div>

<button class="mobile-create-trigger desktop-full-span" onclick="openFormModal()">+ Create Entry</button>

<div class="form-section desktop-form-column" id="formSectionContainer"><h4>+ Create Entry</h4><div class="form-group"><label>Title (Tip: Use '10am', '.projectA')</label><input type="text" id="title" placeholder="e.g., Spring Thief jam 10am .blender"></div><div class="form-group"><label>Description / Note (Optional)</label><textarea id="description" placeholder="Short detail or sub-note..."></textarea></div><div class="form-group"><label>Type</label><select id="type" onchange="handleTypeChange()"><option value="Task">Task (With checkmark)</option><option value="Event">Event</option><option value="Deadline">Deadline (Crimson Red)</option><option value="Habit">Habit / Recurring</option><option value="Birthday">Birthday (Recurring Yearly)</option></select></div><div class="form-group" id="dateGroup"><label id="dateLabel">Date (Leave blank for Inbox)</label><div class="date-input-wrapper"><input type="date" id="date" oninput="checkDateInputState('date','dateTodayBtnContainer')"> <span id="dateTodayBtnContainer"><button type="button" class="btn-today-input" onclick="setTodayDate('date','dateTodayBtnContainer')">Today</button></span></div></div><div class="form-group" id="priorityGroup"><label>Priority Tagging</label><select id="priority"><option value="personal">Personal (Mint Green)</option><option value="professional">Professional (Maroon)</option><option value="daily">Daily (Ink Charcoal)</option></select></div><div class="form-group" id="timeblockGroup"><label>Timeblock Tagging</label><select id="timeblock"><option value="none">None (Slate Grey - Default)</option><option value="morning">3am - 9am (Golden Dawn)</option><option value="work">9am - 5pm (Summer Canopy / Olive)</option><option value="night">5pm - 10pm (Japanese Indigo)</option></select></div><div class="form-buttons"><button class="btn-reset" onclick="resetForm()">Reset</button> <button class="btn-submit" onclick="saveSchedule()">Save Entry</button></div></div>

<div class="desktop-agenda-column"><div class="agenda-list"><div class="agenda-header-row"><h4>📋 Schedule</h4><div class="agenda-controls"><select id="sortBySelect" class="sort-select" onchange="renderAgendaList()"><option value="timeblock">Sort: Timeblock</option><option value="priority">Sort: Priority</option><option value="type">Sort: Type</option></select> <button id="clearFilterBtn" class="btn-clear-filter" style="display:none" onclick="clearDateFilter()">Show All</button></div></div><div class="archive-windows-nav"><button class="btn-window-trigger" onclick="openDirectoryModal('birthdays')">🎂 Birthdays <span id="birthdayBadgeCount" class="nav-counter-badge">0</span></button> <button class="btn-window-trigger" onclick="openDirectoryModal('habits')">🔁 Habits <span id="habitBadgeCount" class="nav-counter-badge">0</span></button> <button class="btn-window-trigger" onclick="openDirectoryModal('skipped')">🕰️ Skipped <span id="skippedBadgeCount" class="nav-counter-badge">0</span></button> <button class="btn-window-trigger" onclick="openDirectoryModal('collections')">🏷️ Labels <span id="labelBadgeCount" class="nav-counter-badge">0</span></button></div><div id="agendaContainer" style="font-size:11px;color:var(--muted-gray)">No entries recorded yet.</div><div id="dumplistContainer"></div></div></div>

function parseTodoistTitle(rt){
    if(!rt)return{cleanTitle:'',timeTags:[],labelTags:[]};
    const tR=/\b(\d{1,2}(?:am|pm)|\d{1,2}:\d{2})\b/gi,lR=/\B(\.[a-zA-Z0-9_-]+)/g;
    let t=[],l=[],m; while((m=tR.exec(rt))!==null)t.push(m[1].toLowerCase()); while((m=lR.exec(rt))!==null)l.push(m[1].substring(1));
    return{cleanTitle:rt.replace(tR,'').replace(lR,'').replace(/\s+/g,' ').trim(),timeTags:t,labelTags:l};
}
function getFirstHabitLabel(rt){const p=parseTodoistTitle(rt);return p.labelTags.length>0?p.labelTags[0]:'general'}

}

async function autoDeleteOldHistory(arr){

function sortItems(arr){
    const sb=document.getElementById('sortBySelect').value;
    return[...arr].sort((a,b)=>{
        if(a.completed&&!b.completed)return 1; if(!a.completed&&b.completed)return -1;
        let tA=a.timeblock||'none',tB=b.timeblock||'none';
        if(sb==='priority'){let pD=(priorityOrder[a.priority]||2)-(priorityOrder[b.priority]||2);return pD!==0?pD:(timeblockOrder[tA]??2)-(timeblockOrder[tB]??2)}
        if(sb==='type'){let tD=(typeOrder[a.type]||3)-(typeOrder[b.type]||3);if(tD!==0)return tD;let tbD=(timeblockOrder[tA]??2)-(timeblockOrder[tB]??2);return tbD!==0?tbD:(priorityOrder[a.priority]||2)-(priorityOrder[b.priority]||2)}
        let tbD=(timeblockOrder[tA]??2)-(timeblockOrder[tB]??2);return tbD!==0?tbD:(priorityOrder[a.priority]||2)-(priorityOrder[b.priority]||2);
    })
}
function renderCalendar(){

    let g='',ts=getTodayDateString(),fD=new Date(y,m,1).getDay(),tD=new Date(y,m+1,0).getDate();
    for(let i=0;i<fD;i++)g+=`<div class="day-cell" style="background:transparent;border-color:transparent;cursor:default"></div>`;
    for(let d=1;d<=tD;d++){
        const fm=String(m+1).padStart(2,'0'),fd=String(d).padStart(2,'0'),ds=`${y}-${fm}-${fd}`;
        let dS=sortItems(schedules.filter(s=>{if(!s.date)return false;if(s.date===ds)return true;if(s.type==='Birthday'||s.recurring==='yearly')return s.date.split('-')[1]===fm&&s.date.split('-')[2]===fd;return false}));
        let bH=''; dS.forEach(s=>{const cC=(s.completed&&(s.date<ts||s.type==='Task'||s.type==='Deadline'||s.type==='Habit'||s.isHabitInstance))?'completed-badge':'';bH+=`<div class="mini-badge ${cC}" style="background:${getBgStyle(s)}">${parseTodoistTitle(s.title).cleanTitle}</div>`});

function exportFullICS(){
    if(!schedules||schedules.length===0)return alert('Tidak ada jadwal untuk diekspor.');
    let cL=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Yorushika Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
    const fd=(ds,iB=false)=>{if(!ds)return null;let c=ds;if(iB&&c.includes('-')){let p=c.split('-');c=`${new Date().getFullYear()}-${p[1]}-${p[2]}`}return c.replace(/-/g,'')};
    schedules.forEach(s=>{
        if(!s.date&&s.type!=='Birthday')return; let iB=(s.type==='Birthday'),d=fd(s.date,iB); if(!d)return;
        let p=parseTodoistTitle(s.title),sm=`[${s.isHabitInstance?'HABIT':s.type}] ${p.cleanTitle}`,dc=s.description?s.description.replace(/\n/g,'\\n'):''; if(p.labelTags.length>0)dc+=`\\nTags: `+p.labelTags.map(l=>'.'+l).join(' ');
        cL.push('BEGIN:VEVENT',`UID:yorushika-${s.id}-${Date.now()}@calendar`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,`DTSTART;VALUE=DATE:${d}`);
        let nD=new Date(s.date); nD.setDate(nD.getDate()+1); cL.push(`DTEND;VALUE=DATE:${nD.getFullYear()}${String(nD.getMonth()+1).padStart(2,'0')}${String(nD.getDate()).padStart(2,'0')}`);
        if(iB||s.recurring==='yearly')cL.push('RRULE:FREQ=YEARLY'); cL.push(`SUMMARY:${sm}`); if(dc)cL.push(`DESCRIPTION:${dc}`); cL.push('END:VEVENT');
    }); cL.push('END:VCALENDAR');
    const b=new Blob([cL.join('\r\n')],{type:'text/calendar;charset=utf-8'}),l=document.createElement('a'); l.href=URL.createObjectURL(b); l.setAttribute('download','yorushika_calendar.ics'); document.body.appendChild(l); l.click(); document.body.removeChild(l);
}

function renderCardHTML(s,bS,iB=false,wA='',iH='',iDM=false){

    let dH=(s.description&&s.description.trim()!=='')?`<p>💬 ${s.description}</p>`:'',tP=s.isHabitInstance||s.type==='Habit'?'[HABIT]':`[${s.type}]`,sC=(s.type==='Task'||s.type==='Deadline'||s.type==='Habit'||s.isHabitInstance);
    return `<div class="${iC}" style="background:${bS};margin-bottom:6px" ${wA} ${iDM?'':`onclick="openDetailModal('${s.id}')"`}>${iH}<div class="agenda-content"><h4>${tP} ${p.cleanTitle}</h4>${dH}<p>🏷️ ${tD}</p>${pH?`<div class="pill-badges-wrap">${pH}</div>`:''}</div><div class="agenda-actions">${sC?`<input type="checkbox" ${s.completed?'checked':''} onclick="toggleComplete('${s.id}',event)">`:''}<button class="btn-edit" onclick="editSchedule('${s.id}');event.stopPropagation();">Edit</button><button class="btn-delete" onclick="deleteSchedule('${s.id}',event)">X</button></div></div>`;

function renderHabitCardHTML(s,bS){

function renderHabitBinCardHTML(s,bS){

async function archiveHabit(id,e){if(e)e.stopPropagation();if(!confirm('Move to Bin?'))return;const{error}=await supabaseClient.from('schedules').update({completed:true}).eq('id',id);if(!error){await fetchSchedules();openDirectoryModal('habits')}}
async function restoreHabit(id,e){if(e)e.stopPropagation();const{error}=await supabaseClient.from('schedules').update({completed:false}).eq('id',id);if(!error){await fetchSchedules();openDirectoryModal('habits_bin')}}
async function deleteHabitPermanent(id,e){if(e)e.stopPropagation();if(!confirm('Delete permanently?'))return;const{error}=await supabaseClient.from('schedules').delete().eq('id',id);if(!error){await fetchSchedules();openDirectoryModal('habits_bin')}}
function buildHabitHeatmapHTML(t,aC){
    const cD=new Set(schedules.filter(x=>x.isHabitInstance&&x.completed===true&&x.title===t&&x.date).map(x=>x.date)),td=new Date(); td.setHours(0,0,0,0); const eW=new Date(td); eW.setDate(td.getDate()+(6-td.getDay())); const sD=new Date(eW); sD.setDate(eW.getDate()-(53*7)+1);
    let dH='',dC=0; for(let c=0;c<53;c++){for(let r=0;r<7;r++){const cdt=new Date(sD);cdt.setDate(sD.getDate()+c*7+r);if(cdt>td)continue;const ds=`${cdt.getFullYear()}-${String(cdt.getMonth()+1).padStart(2,'0')}-${String(cdt.getDate()).padStart(2,'0')}`,iF=cD.has(ds);if(iF)dC++;dH+=`<circle cx="${c*10+5}" cy="${r*10+5}" r="3.3" fill="${iF?aC:'var(--border-color)'}"><title>${ds}${iF?' — done':''}</title></circle>`}}
    return `<div style="color:var(--muted-gray);font-size:10px;margin:8px 0 4px">Contribution Heatmap (Past Year) — ${dC} done</div><div style="background:var(--bg-pure);border:1px solid var(--border-color);border-radius:6px;padding:8px"><svg viewBox="0 0 530 70" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">${dH}</svg></div>`;
}

function renderAgendaList(){

    }
