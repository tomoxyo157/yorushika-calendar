<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorushika Calendar // ヨルシカ</title>
    <link rel="icon" type="image/png" href="https://yorushika.com/static/yorushika/official/feature/tour2022/images/ph_logo_PGWx6f7Q.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --main-font: 'Syne', sans-serif;
            --bg-pure: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --text-main: #e6e6e6;
            --muted-gray: #737373;
        }
        
        body, input, select, textarea, button {
            font-family: var(--main-font);
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            text-transform: uppercase;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 2px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mobile-create-trigger {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            margin-bottom: 4px;
        }
        .mobile-create-trigger:hover { background: #e0e0e0; }

        @media (min-width: 1100px) {
            .container {
                max-width: 1450px;
                display: grid;
                grid-template-columns: 420px 1fr 380px;
                grid-template-rows: auto auto auto;
                gap: 20px;
                align-items: start;
            }
            .desktop-full-span { grid-column: span 3; }
            .desktop-agenda-column { grid-column: 1; grid-row: 2 / span 2; }
            .desktop-calendar-column { grid-column: 2; grid-row: 2 / span 2; }
            .desktop-form-column { grid-column: 3; grid-row: 2 / span 2; margin-top: 0 !important; display: block !important; }
            .mobile-create-trigger { display: none !important; }
        }
        
        #dbStatus {
            font-size: 12px;
            text-align: center;
            padding: 5px;
            border: 1px dashed var(--border-color);
            background: #000;
        }
        
        .yorushika-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }
        .eye-logo-svg {
            width: 70px;
            height: 35px;
            fill: #ffffff;
            margin-bottom: 6px;
        }
        .jp-title-logo {
            font-size: 24px;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0;
        }
        .sub-tag {
            font-size: 9px;
            color: var(--muted-gray);
            letter-spacing: 2px;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            font-size: 22px;
            letter-spacing: 3px;
            margin: 0 0 10px 0; 
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }
        
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #000000;
            padding: 8px;
            border: 1px solid var(--border-color);
        }
        .calendar-nav h3 {
            font-size: 16px;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
        }
        .calendar-nav button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .calendar-nav button:hover { background: #ffffff; color: #000000; }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            color: var(--muted-gray);
            margin-bottom: 4px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            height: 75px; 
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 1px;
            padding: 3px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .day-cell:hover { border-color: #ffffff; background: #111111; }
        .day-cell.today {
            border: 1px solid #ffffff;
            background: #141414;
        }
        .day-cell.today .day-number {
            color: #ffffff;
            text-decoration: underline;
        }
        .day-number { font-weight: bold; color: var(--muted-gray); font-size: 13px; }
        
        .badges-container {
            max-height: 45px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .mini-badge {
            font-size: 8px;
            color: #ffffff;
            padding: 1px 3px;
            border-radius: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .form-section {
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            display: none;
        }
        .form-section h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 9px; color: var(--muted-gray); }
        input, select, textarea {
            width: 100%;
            padding: 7px;
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 11px;
            text-transform: uppercase;
        }
        select option { text-transform: uppercase; }
        textarea { resize: vertical; min-height: 50px; white-space: pre-wrap; }
        input:focus, select:focus, textarea:focus { outline: 1px solid #ffffff; }
        
        .form-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-submit {
            flex: 2;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-reset {
            flex: 1;
            background: #1a1a1a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .agenda-list { 
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            margin-bottom: 12px;
        }
        .agenda-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }
        .agenda-list h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
        }
        .agenda-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .sort-select {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
            width: auto;
        }
        .btn-clear-filter {
            background: #1a1a1a;
            color: #ff5555;
            border: 1px solid var(--border-color);
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
        }
        .btn-clear-filter:hover { background: #ff5555; color: #fff; }

        .archive-windows-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }
        .btn-window-trigger {
            background: #141414;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            font-size: 9px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .btn-window-trigger:hover { background: #ffffff; color: #000000; }

        .nav-counter-badge {
            background: #ffffff;
            color: #000000;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 10px;
            margin-left: 2px;
            display: inline-block;
            vertical-align: middle;
        }
        .btn-window-trigger:hover .nav-counter-badge {
            background: #000000;
            color: #ffffff;
        }

        .label-badges-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .tag-badge {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 2px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .tag-badge .remove-tag {
            cursor: pointer;
            color: #ff5555;
            font-weight: bold;
        }
        .tag-badge .remove-tag:hover { color: #fff; }

        .section-category-box {
            background: #060606;
            border: 1px solid var(--border-color);
            padding: 8px;
            margin-bottom: 8px;
        }
        .section-category-title {
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        
        .agenda-item {
            padding: 8px;
            border-radius: 2px;
            margin-bottom: 5px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
        }
        .agenda-item:hover { border-color: #ffffff; }
        .agenda-item.completed-item {
            opacity: 0.35 !important;
            border-style: dashed;
        }
        .agenda-item.completed-item .agenda-content h4,
        .agenda-item.completed-item .agenda-content p {
            text-decoration: line-through !important;
        }
        
        .agenda-content {
            flex-grow: 1;
            overflow: hidden;
            padding-right: 8px;
        }
        .agenda-content h4 { 
            margin: 0; font-size: 11px; font-weight: 600; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; 
        }
        .agenda-content p { 
            margin: 2px 0 0 0; font-size: 9px; opacity: 0.85; 
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis; white-space: normal; word-break: break-all; text-transform: uppercase; 
        }
        
        .agenda-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .agenda-actions input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
        .btn-edit {
            background: rgba(0, 0, 0, 0.6);
            color: #55ff55;
            border: 1px solid #55ff55;
            padding: 3px 6px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-edit:hover { background: #55ff55; color: black; }
        .btn-delete {
            background: rgba(0, 0, 0, 0.6);
            color: #ff5555;
            border: 1px solid #ff5555;
            padding: 3px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-delete:hover { background: #ff5555; color: white; }

        /* Animations for Modal Pop-up & Pop-out */
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-card {
            background: #0d0d0d;
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .modal-card.hiding {
            animation: popOut 0.2s ease-in forwards;
        }
        .modal-header {
            font-size: 15px;
            color: #fff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-scroll-body {
            overflow-y: auto;
            max-height: calc(80vh - 60px);
            padding-right: 4px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-body p {
            margin: 6px 0;
            font-size: 11px;
            white-space: pre-wrap;
            text-transform: uppercase;
        }
        .modal-body strong {
            color: var(--muted-gray);
            font-size: 9px;
            display: block;
            text-transform: uppercase;
        }

        .overflow-view-btn {
            display: block;
            width: 100%;
            background: #141414;
            color: #fff;
            border: 1px dashed var(--border-color);
            padding: 6px;
            text-align: center;
            font-size: 10px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
        }
        .overflow-view-btn:hover { background: #222; }

        .footer-tag {
            text-align: center;
            font-size: 11px;
            color: var(--muted-gray);
            margin-top: 10px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="yorushika-header desktop-full-span">
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <p class="jp-title-logo">ヨルシカ</p>
        <span class="sub-tag">Music & Schedule Archive</span>
    </div>
    
    <div class="desktop-calendar-column">
        <h2>Calendar</h2>
        <div class="calendar-nav">
            <button onclick="changeMonth(-1)">◀</button>
            <h3 id="monthYearDisplay"></h3>
            <button onclick="changeMonth(1)">▶</button>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- Mobile Trigger for Form Modal -->
    <button class="mobile-create-trigger desktop-full-span" onclick="openFormModal()">+ Create Entry</button>

    <!-- Form Section (Desktop Version) -->
    <div class="form-section desktop-form-column" id="formSectionContainer">
        <h4 id="formTitleHeader">+ Create Entry</h4>
        <input type="hidden" id="editEntryId">
        <div class="form-group">
            <label>Title (Gunakan .label untuk sistem tag, cth: .projectA)</label>
            <input type="text" id="title" placeholder="e.g., Rapat .projectA 10am">
        </div>
        <div class="form-group">
            <label>Description / Note (Optional)</label>
            <textarea id="description" placeholder="Short detail or sub-note..."></textarea>
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="type" onchange="handleTypeChange()">
                <option value="Event">Event</option>
                <option value="Task">Task (With checkmark)</option>
                <option value="Birthday">Birthday (Recurring Yearly)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="dateLabel">Date (Leave blank for Inbox)</label>
            <input type="date" id="date">
        </div>
        <div class="form-group" id="priorityGroup">
            <label>Priority Tagging</label>
            <select id="priority">
                <option value="personal">Personal (Mint Green)</option>
                <option value="professional">Professional (Maroon)</option>
                <option value="daily">Daily (Ink Charcoal)</option>
            </select>
        </div>
        <div class="form-group" id="timeblockGroup">
            <label>Timeblock Tagging</label>
            <select id="timeblock">
                <option value="morning">3am - 9am (Golden Dawn)</option>
                <option value="work">9am - 5pm (Summer Canopy / Olive)</option>
                <option value="night">5pm - 10pm (Japanese Indigo)</option>
            </select>
        </div>
        <div class="form-buttons">
            <button class="btn-reset" onclick="resetForm()">Reset</button>
            <button class="btn-submit" id="submitBtn" onclick="saveSchedule()">Save Entry</button>
        </div>
    </div>

    <div class="desktop-agenda-column">
        <div class="agenda-list">
            <div class="agenda-header-row">
                <h4>📋 Schedule Archive</h4>
                <div class="agenda-controls">
                    <select id="sortBySelect" class="sort-select" onchange="renderAgendaList()">
                        <option value="timeblock">Sort: Timeblock</option>
                        <option value="priority">Sort: Priority</option>
                        <option value="type">Sort: Type</option>
                    </select>
                    <button id="clearFilterBtn" class="btn-clear-filter" style="display:none;" onclick="clearDateFilter()">Show All</button>
                </div>
            </div>

            <div class="archive-windows-nav">
                <button class="btn-window-trigger" onclick="openDirectoryModal('birthdays')">
                    🎂 Birthdays <span id="birthdayBadgeCount" class="nav-counter-badge">0</span>
                </button>
                <button class="btn-window-trigger" onclick="openDirectoryModal('skipped')">
                    🕰️ Skipped <span id="skippedBadgeCount" class="nav-counter-badge">0</span>
                </button>
                <button class="btn-window-trigger" onclick="openDirectoryModal('labels')">
                    🏷️ Labels <span id="labelBadgeCount" class="nav-counter-badge">0</span>
                </button>
            </div>

            <div id="agendaContainer" style="font-size: 11px; color: var(--muted-gray);">No entries recorded yet.</div>
            <div id="overflowTriggerContainer"></div>
        </div>
    </div>

    <div id="dbStatus" class="desktop-full-span">Menghubungkan ke Supabase Cloud...</div>

    <div class="footer-tag desktop-full-span">
        <span>― 夜을歩く者のための記録 ―</span>
    </div>
</div>

<!-- Modal Form Mobile -->
<div class="modal-overlay" id="formModal" onclick="closeModal(event, 'formModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalFormHeaderTitle">Create Entry</span>
            <button class="modal-close" onclick="closeFormModal()">×</button>
        </div>
        <div class="modal-scroll-body">
            <div style="padding: 2px;">
                <input type="hidden" id="m_editEntryId">
                <div class="form-group">
                    <label>Title (.label cth: .projectA)</label>
                    <input type="text" id="m_title" placeholder="e.g., Rapat .projectA 10am">
                </div>
                <div class="form-group">
                    <label>Description / Note (Optional)</label>
                    <textarea id="m_description" placeholder="Short detail or sub-note..."></textarea>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select id="m_type" onchange="m_handleTypeChange()">
                        <option value="Event">Event</option>
                        <option value="Task">Task (With checkmark)</option>
                        <option value="Birthday">Birthday (Recurring Yearly)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="m_dateLabel">Date (Leave blank for Inbox)</label>
                    <input type="date" id="m_date">
                </div>
                <div class="form-group" id="m_priorityGroup">
                    <label>Priority Tagging</label>
                    <select id="m_priority">
                        <option value="personal">Personal (Mint Green)</option>
                        <option value="professional">Professional (Maroon)</option>
                        <option value="daily">Daily (Ink Charcoal)</option>
                    </select>
                </div>
                <div class="form-group" id="m_timeblockGroup">
                    <label>Timeblock Tagging</label>
                    <select id="m_timeblock">
                        <option value="morning">3am - 9am (Golden Dawn)</option>
                        <option value="work">9am - 5pm (Summer Canopy / Olive)</option>
                        <option value="night">5pm - 10pm (Japanese Indigo)</option>
                    </select>
                </div>
                <div class="form-buttons">
                    <button class="btn-reset" onclick="m_resetForm()">Reset</button>
                    <button class="btn-submit" id="m_submitBtn" onclick="m_saveSchedule()">Save Entry</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Detail -->
<div class="modal-overlay" id="detailModal" onclick="closeModal(event, 'detailModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalTitleText">Entry Detail</span>
            <button class="modal-close" onclick="closeDetailModal()">×</button>
        </div>
        <div class="modal-scroll-body">
            <div class="modal-body" id="modalBodyContent"></div>
        </div>
    </div>
</div>

<!-- Modal Directory (Birthdays, Skipped, Labels/Collections) -->
<div class="modal-overlay" id="directoryModal" onclick="closeModal(event, 'directoryModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="directoryModalTitle">Directory</span>
            <button class="modal-close" onclick="closeDirectoryModal()">×</button>
        </div>
        <div class="modal-scroll-body">
            <div id="directoryModalContent" style="font-size: 11px;"></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_u01IYdkiCB_VnoKYvcBzww_U3-cTiM8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let schedules = [];
    let selectedFilterDate = null;
    let currentTagFilter = null;

    const priorityColors = { personal: '#7a9c72', professional: '#800020', daily: '#3b3b3b' };
    const timeblockColors = { morning: '#8c6d36', work: '#4f5d2f', night: '#1b263b' };
    const timeblockOrder = { morning: 1, work: 2, night: 3 };
    const priorityOrder = { professional: 1, daily: 2, personal: 3 };
    const typeOrder = { Task: 1, Event: 2, Birthday: 3 };

    let currentDate = new Date();

    // Helper untuk Animasi Modal Smooth Pop-up & Pop-out
    function showModalOverlay(modalId) {
        const overlay = document.getElementById(modalId);
        overlay.classList.add('active');
        const card = overlay.querySelector('.modal-card');
        card.classList.remove('hiding');
    }

    function hideModalOverlay(modalId, callback) {
        const overlay = document.getElementById(modalId);
        const card = overlay.querySelector('.modal-card');
        card.classList.add('hiding');
        setTimeout(() => {
            overlay.classList.remove('active');
            card.classList.remove('hiding');
            if (callback) callback();
        }, 180);
    }

    function closeModal(event, modalId) {
        if (event.target.id === modalId) {
            hideModalOverlay(modalId);
        }
    }

    // Parser Pintar: Ekstrak tag titik (cth: .projectA) dari judul
    function parseTagsAndTitle(rawTitle) {
        if (!rawTitle) return { cleanTitle: '', tags: [] };
        const regex = /\s*\.([a-zA-Z0-9_-]+)/g;
        let tags = [];
        let match;
        while ((match = regex.exec(rawTitle)) !== null) {
            tags.push(match[1]);
        }
        let cleanTitle = rawTitle.replace(regex, '').trim();
        return { cleanTitle: cleanTitle || rawTitle, tags };
    }

    function handleTypeChange() {
        const typeVal = document.getElementById('type').value;
        const priorityGrp = document.getElementById('priorityGroup');
        const timeblockGrp = document.getElementById('timeblockGroup');
        const dateLbl = document.getElementById('dateLabel');
        const dateInput = document.getElementById('date');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateLbl.innerText = 'Birthday Date (DD/MM)';
            dateInput.type = 'date';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateLbl.innerText = 'Date (Leave blank for Inbox)';
            dateInput.type = 'date';
        }
    }

    function m_handleTypeChange() {
        const typeVal = document.getElementById('m_type').value;
        const priorityGrp = document.getElementById('m_priorityGroup');
        const timeblockGrp = document.getElementById('m_timeblockGroup');
        const dateLbl = document.getElementById('m_dateLabel');
        const dateInput = document.getElementById('m_date');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateLbl.innerText = 'Birthday Date (DD/MM)';
            dateInput.type = 'date';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateLbl.innerText = 'Date (Leave blank for Inbox)';
            dateInput.type = 'date';
        }
    }

    async function fetchSchedules() {
        const { data, error } = await supabaseClient
            .from('schedules')
            .select('*')
            .order('date', { ascending: true, nullsFirst: false });

        const statusEl = document.getElementById('dbStatus');
        if (error) {
            statusEl.innerText = '⚠️ Gagal terhubung ke Cloud (Offline Mode)';
            statusEl.style.color = '#ff5555';
            schedules = JSON.parse(localStorage.getItem('yorushika_schedules')) || [];
        } else {
            statusEl.innerText = '☁️ Terhubung ke Supabase Cloud (Live)';
            statusEl.style.color = '#55ff55';
            schedules = data || [];
            localStorage.setItem('yorushika_schedules', JSON.stringify(schedules));
        }
        updateArchiveCounters();
        renderCalendar();
        renderAgendaList();
    }

    function updateArchiveCounters() {
        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        const birthdayCount = schedules.filter(s => s.type === 'Birthday').length;
        const skippedCount = schedules.filter(s => s.type === 'Task' && s.date && s.date < todayStr && !s.completed).length;
        
        // Hitung total unique labels
        let uniqueTags = new Set();
        schedules.forEach(s => {
            if (s.tags && Array.isArray(s.tags)) {
                s.tags.forEach(t => uniqueTags.add(t));
            }
        });

        document.getElementById('birthdayBadgeCount').innerText = birthdayCount;
        document.getElementById('skippedBadgeCount').innerText = skippedCount;
        document.getElementById('labelBadgeCount').innerText = uniqueTags.size;
    }

    function sortItems(items) {
        const sortBy = document.getElementById('sortBySelect').value;
        return [...items].sort((a, b) => {
            if (sortBy === 'priority') {
                let pDiff = (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
                if (pDiff !== 0) return pDiff;
                return (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2);
            } else if (sortBy === 'type') {
                let tDiff = (typeOrder[a.type] || 2) - (typeOrder[b.type] || 2);
                if (tDiff !== 0) return tDiff;
                let tbDiff = (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2);
                if (tbDiff !== 0) return tbDiff;
                return (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
            } else {
                let tbDiff = (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2);
                if (tbDiff !== 0) return tbDiff;
                return (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
            }
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        let gridHTML = '';
        for (let i = 0; i < firstDayIndex; i++) {
            gridHTML += `<div class="day-cell" style="background: transparent; border-color: transparent; cursor: default;"></div>`;
        }

        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        for (let day = 1; day <= totalDays; day++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

            const daySchedules = schedules.filter(s => s.date === dateStr);
            const isToday = (dateStr === todayStr);

            let badgesHTML = '';
            daySchedules.slice(0, 3).forEach(s => {
                let bg = '#333';
                if (s.type === 'Birthday') bg = '#ff4d6d';
                else if (s.priority) bg = priorityColors[s.priority] || '#333';

                badgesHTML += `<div class="mini-badge ${s.completed ? 'completed-badge' : ''}" style="background-color: ${bg};">${s.title}</div>`;
            });

            if (daySchedules.length > 3) {
                badgesHTML += `<div style="font-size:7px; color:#aaa; text-align:center;">+${daySchedules.length - 3} more</div>`;
            }

            gridHTML += `
                <div class="day-cell ${isToday ? 'today' : ''}" onclick="filterByDate('${dateStr}')">
                    <span class="day-number">${day}</span>
                    <div class="badges-container">${badgesHTML}</div>
                </div>
            `;
        }

        document.getElementById('daysGrid').innerHTML = gridHTML;
    }

    function filterByDate(dateStr) {
        selectedFilterDate = dateStr;
        currentTagFilter = null;
        document.getElementById('clearFilterBtn').style.display = 'inline-block';
        renderAgendaList();
    }

    function clearDateFilter() {
        selectedFilterDate = null;
        currentTagFilter = null;
        document.getElementById('clearFilterBtn').style.display = 'none';
        renderAgendaList();
    }

    function renderAgendaList() {
        let filtered = [...schedules];

        if (selectedFilterDate) {
            filtered = filtered.filter(s => s.date === selectedFilterDate);
            document.getElementById('clearFilterBtn').style.display = 'inline-block';
        } else if (currentTagFilter) {
            filtered = filtered.filter(s => s.tags && s.tags.includes(currentTagFilter));
            document.getElementById('clearFilterBtn').style.display = 'inline-block';
        }

        filtered = sortItems(filtered);

        const container = document.getElementById('agendaContainer');
        const triggerContainer = document.getElementById('overflowTriggerContainer');
        triggerContainer.innerHTML = '';

        if (filtered.length === 0) {
            container.innerHTML = selectedFilterDate || currentTagFilter ? 'No entries match this filter.' : 'No entries recorded yet.';
            return;
        }

        // Batasi tampilan utama max 5 item agar tidak overflow, sisanya masuk ke window pop-up
        const maxDisplay = 5;
        const displayItems = filtered.slice(0, maxDisplay);
        const overflowItems = filtered.slice(maxDisplay);

        container.innerHTML = displayItems.map(s => buildAgendaItemHTML(s)).join('');

        if (overflowItems.length > 0) {
            triggerContainer.innerHTML = `
                <button class="overflow-view-btn" onclick="openOverflowModal(${filtered.length})">
                    View All (${filtered.length} entries) ...
                </button>
            `;
        }
    }

    function buildAgendaItemHTML(s) {
        let bg = '#141414';
        if (s.type === 'Birthday') bg = '#4a1525';
        else if (s.timeblock) bg = timeblockColors[s.timeblock] || '#141414';

        let tagsHTML = '';
        if (s.tags && s.tags.length > 0) {
            tagsHTML = `<div class="label-badges-row">` + s.tags.map(t => `<span class="tag-badge">#${t}</span>`).join('') + `</div>`;
        }

        return `
            <div class="agenda-item ${s.completed ? 'completed-item' : ''}" style="background-color: ${bg};" onclick="openDetailModal('${s.id}')">
                <div class="agenda-content">
                    <h4>${s.title}</h4>
                    <p>${s.description || (s.date ? 'Date: ' + s.date : 'Inbox Entry')}</p>
                    ${tagsHTML}
                </div>
                <div class="agenda-actions" onclick="event.stopPropagation()">
                    ${s.type === 'Task' ? `<input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleComplete('${s.id}', this.checked)">` : ''}
                    <button class="btn-edit" onclick="editSchedule('${s.id}')">EDIT</button>
                    <button class="btn-delete" onclick="deleteSchedule('${s.id}')">DEL</button>
                </div>
            </div>
        `;
    }

    // Fungsi simpan entry dengan ekstraksi tag titik otomatis
    async function saveSchedule() {
        const editId = document.getElementById('editEntryId').value;
        const rawTitle = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const type = document.getElementById('type').value;
        const date = document.getElementById('date').value;
        const priority = document.getElementById('priority').value;
        const timeblock = document.getElementById('timeblock').value;

        if (!rawTitle) {
            alert('Title is required!');
            return;
        }

        const { cleanTitle, tags } = parseTagsAndTitle(rawTitle);

        const payload = {
            title: cleanTitle,
            description,
            type,
            date: date || null,
            priority: type === 'Birthday' ? null : priority,
            timeblock: type === 'Birthday' ? null : timeblock,
            tags: tags.length > 0 ? tags : []
        };

        let error;
        if (editId) {
            const res = await supabaseClient.from('schedules').update(payload).eq('id', editId);
            error = res.error;
        } else {
            const res = await supabaseClient.from('schedules').insert([payload]);
            error = res.error;
        }

        if (error) {
            alert('Gagal menyimpan ke Cloud: ' + error.message);
        } else {
            resetForm();
            fetchSchedules();
        }
    }

    async function m_saveSchedule() {
        const editId = document.getElementById('m_editEntryId').value;
        const rawTitle = document.getElementById('m_title').value.trim();
        const description = document.getElementById('m_description').value.trim();
        const type = document.getElementById('m_type').value;
        const date = document.getElementById('m_date').value;
        const priority = document.getElementById('m_priority').value;
        const timeblock = document.getElementById('m_timeblock').value;

        if (!rawTitle) {
            alert('Title is required!');
            return;
        }

        const { cleanTitle, tags } = parseTagsAndTitle(rawTitle);

        const payload = {
            title: cleanTitle,
            description,
            type,
            date: date || null,
            priority: type === 'Birthday' ? null : priority,
            timeblock: type === 'Birthday' ? null : timeblock,
            tags: tags.length > 0 ? tags : []
        };

        let error;
        if (editId) {
            const res = await supabaseClient.from('schedules').update(payload).eq('id', editId);
            error = res.error;
        } else {
            const res = await supabaseClient.from('schedules').insert([payload]);
            error = res.error;
        }

        if (error) {
            alert('Gagal menyimpan ke Cloud: ' + error.message);
        } else {
            closeFormModal();
            m_resetForm();
            fetchSchedules();
        }
    }

    async function toggleComplete(id, completed) {
        await supabaseClient.from('schedules').update({ completed }).eq('id', id);
        fetchSchedules();
    }

    async function deleteSchedule(id) {
        if (confirm('Hapus entri ini?')) {
            await supabaseClient.from('schedules').delete().eq('id', id);
            fetchSchedules();
        }
    }

    function editSchedule(id) {
        const item = schedules.find(s => s.id == id);
        if (!item) return;

        // Kembalikan tag ke format titik untuk diedit jika diinginkan
        let displayTitle = item.title;
        if (item.tags && item.tags.length > 0) {
            displayTitle += ' ' + item.tags.map(t => '.' + t).join(' ');
        }

        if (window.innerWidth < 1100) {
            openFormModal();
            document.getElementById('m_editEntryId').value = item.id;
            document.getElementById('m_title').value = displayTitle;
            document.getElementById('m_description').value = item.description || '';
            document.getElementById('m_type').value = item.type;
            m_handleTypeChange();
            document.getElementById('m_date').value = item.date || '';
            if (item.priority) document.getElementById('m_priority').value = item.priority;
            if (item.timeblock) document.getElementById('m_timeblock').value = item.timeblock;
            document.getElementById('m_modalFormHeaderTitle').innerText = 'Edit Entry';
            document.getElementById('m_submitBtn').innerText = 'Update Entry';
        } else {
            document.getElementById('editEntryId').value = item.id;
            document.getElementById('title').value = displayTitle;
            document.getElementById('description').value = item.description || '';
            document.getElementById('type').value = item.type;
            handleTypeChange();
            document.getElementById('date').value = item.date || '';
            if (item.priority) document.getElementById('priority').value = item.priority;
            if (item.timeblock) document.getElementById('timeblock').value = item.timeblock;
            document.getElementById('formTitleHeader').innerText = 'Edit Entry';
            document.getElementById('submitBtn').innerText = 'Update Entry';
            document.getElementById('formSectionContainer').style.display = 'block';
        }
    }

    function resetForm() {
        document.getElementById('editEntryId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('type').value = 'Event';
        handleTypeChange();
        document.getElementById('date').value = '';
        document.getElementById('formTitleHeader').innerText = '+ Create Entry';
        document.getElementById('submitBtn').innerText = 'Save Entry';
    }

    function m_resetForm() {
        document.getElementById('m_editEntryId').value = '';
        document.getElementById('m_title').value = '';
        document.getElementById('m_description').value = '';
        document.getElementById('m_type').value = 'Event';
        m_handleTypeChange();
        document.getElementById('m_date').value = '';
        document.getElementById('modalFormHeaderTitle').innerText = 'Create Entry';
        document.getElementById('m_submitBtn').innerText = 'Save Entry';
    }

    // Modal Controls dengan Smooth Anim
    function openFormModal() {
        showModalOverlay('formModal');
    }
    function closeFormModal() {
        hideModalOverlay('formModal');
    }

    function openDetailModal(id) {
        const item = schedules.find(s => s.id == id);
        if (!item) return;

        document.getElementById('modalTitleText').innerText = item.title;
        
        let tagsHTML = '';
        if (item.tags && item.tags.length > 0) {
            tagsHTML = `<strong>Labels / Collections</strong><div class="label-badges-row">` + 
                item.tags.map(t => `<span class="tag-badge">#${t} <span class="remove-tag" onclick="unlinkTag('${item.id}', '${t}')" title="Lepas label ini">×</span></span>`).join('') + 
                `</div><br>`;
        }

        document.getElementById('modalBodyContent').innerHTML = `
            <strong>Type</strong>
            <p>${item.type}</p>
            <strong>Date</strong>
            <p>${item.date || 'No Date (Inbox)'}</p>
            <strong>Description</strong>
            <p>${item.description || 'No description provided.'}</p>
            ${tagsHTML}
        `;
        showModalOverlay('detailModal');
    }
    function closeDetailModal() {
        hideModalOverlay('detailModal');
    }

    // Fitur Blender-like Collection: Melepaskan tag dari event tertentu
    async function unlinkTag(itemId, tagToRemove) {
        const item = schedules.find(s => s.id == itemId);
        if (!item) return;

        const newTags = item.tags.filter(t => t !== tagToRemove);
        const { error } = await supabaseClient.from('schedules').update({ tags: newTags }).eq('id', itemId);

        if (!error) {
            closeDetailModal();
            fetchSchedules();
        }
    }

    // Direktori Modal (Birthdays, Skipped, Labels)
    function openDirectoryModal(type) {
        const titleEl = document.getElementById('directoryModalTitle');
        const contentEl = document.getElementById('directoryModalContent');
        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        if (type === 'birthdays') {
            titleEl.innerText = '🎂 Birthdays Directory';
            const bdays = schedules.filter(s => s.type === 'Birthday');
            if (bdays.length === 0) {
                contentEl.innerHTML = 'No birthdays recorded.';
            } else {
                contentEl.innerHTML = bdays.map(s => buildAgendaItemHTML(s)).join('');
            }
        } else if (type === 'skipped') {
            titleEl.innerText = '🕰️ Skipped Tasks';
            const skipped = schedules.filter(s => s.type === 'Task' && s.date && s.date < todayStr && !s.completed);
            if (skipped.length === 0) {
                contentEl.innerHTML = 'No skipped tasks.';
            } else {
                contentEl.innerHTML = skipped.map(s => buildAgendaItemHTML(s)).join('');
            }
        } else if (type === 'labels') {
            titleEl.innerText = '🏷️ Labels & Collections';
            let tagMap = {};
            schedules.forEach(s => {
                if (s.tags && Array.isArray(s.tags)) {
                    s.tags.forEach(t => {
                        if (!tagMap[t]) tagMap[t] = [];
                        tagMap[t].push(s);
                    });
                }
            });

            const tagKeys = Object.keys(tagMap);
            if (tagKeys.length === 0) {
                contentEl.innerHTML = 'No labels created yet. Gunakan titik (cth: .projectA) pada title.';
            } else {
                contentEl.innerHTML = tagKeys.map(t => `
                    <div class="section-category-box">
                        <div class="section-category-title">
                            <span>#${t} (${tagMap[t].length} items)</span>
                            <button class="btn-clear-filter" onclick="filterByTag('${t}')">Filter List</button>
                        </div>
                        <div>${tagMap[t].map(s => `<span style="display:inline-block; margin:2px; font-size:9px;" class="tag-badge">${s.title}</span>`).join('')}</div>
                    </div>
                `).join('');
            }
        }

        showModalOverlay('directoryModal');
    }
    function closeDirectoryModal() {
        hideModalOverlay('directoryModal');
    }

    function filterByTag(tag) {
        currentTagFilter = tag;
        selectedFilterDate = null;
        closeDirectoryModal();
        document.getElementById('clearFilterBtn').style.display = 'inline-block';
        renderAgendaList();
    }

    function openOverflowModal(totalCount) {
        const titleEl = document.getElementById('directoryModalTitle');
        const contentEl = document.getElementById('directoryModalContent');
        titleEl.innerText = `📋 All Entries (${totalCount})`;
        
        let filtered = [...schedules];
        if (selectedFilterDate) filtered = filtered.filter(s => s.date === selectedFilterDate);
        else if (currentTagFilter) filtered = filtered.filter(s => s.tags && s.tags.includes(currentTagFilter));
        filtered = sortItems(filtered);

        contentEl.innerHTML = filtered.map(s => buildAgendaItemHTML(s)).join('');
        showModalOverlay('directoryModal');
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    window.onload = () => {
        fetchSchedules();
        if (window.innerWidth >= 1100) {
            document.getElementById('formSectionContainer').style.display = 'block';
        }
    };
</script>
