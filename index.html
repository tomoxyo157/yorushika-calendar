<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorushika Calendar // ヨルシカ</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Supabase CDN Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-pure: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --text-main: #e6e6e6;
            --muted-gray: #737373;
            --accent-glow: #ffffff;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-pure);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 2px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
        }
        
        /* Status Bar Supabase */
        #dbStatus {
            font-family: 'VT323', monospace;
            font-size: 13px;
            text-align: center;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px dashed var(--border-color);
            background: #000;
        }
        
        /* Yorushika Official Eye Logo Header */
        .yorushika-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .eye-logo-svg {
            width: 70px;
            height: 35px;
            fill: #ffffff;
            margin-bottom: 6px;
        }
        .jp-title-logo {
            font-family: 'VT323', monospace;
            font-size: 24px;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0;
            text-transform: uppercase;
        }
        .sub-tag {
            font-size: 9px;
            color: var(--muted-gray);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: monospace;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            font-family: 'VT323', monospace;
            font-size: 26px;
            letter-spacing: 3px;
            margin: 0 0 10px 0; 
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }
        
        /* Navigation */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #000000;
            padding: 8px;
            border: 1px solid var(--border-color);
        }
        .calendar-nav h3 {
            font-family: 'VT323', monospace;
            font-size: 20px;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
        }
        .calendar-nav button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-family: 'VT323', monospace;
            font-size: 16px;
            cursor: pointer;
        }
        .calendar-nav button:hover { background: #ffffff; color: #000000; }

        /* Calendar Grid */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            color: var(--muted-gray);
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            min-height: 65px;
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 1px;
            padding: 3px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .day-cell:hover { border-color: #ffffff; background: #111111; }
        
        /* Penanda Hari Ini (Today Highlight) */
        .day-cell.today {
            border: 1px solid #ffffff;
            background: #141414;
        }
        .day-cell.today .day-number {
            color: #ffffff;
            text-decoration: underline;
        }

        .day-number { font-weight: bold; color: var(--muted-gray); font-family: 'VT323', monospace; font-size: 15px; }
        
        .mini-badge {
            font-size: 8px;
            color: #ffffff;
            padding: 1px 3px;
            border-radius: 1px;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Form Input */
        .form-section {
            margin-top: 16px;
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }
        .form-section h4 {
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 10px; color: var(--muted-gray); text-transform: uppercase; }
        input, select {
            width: 100%;
            padding: 7px;
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        input:focus, select:focus { outline: 1px solid #ffffff; }
        
        .form-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-submit {
            flex: 2;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-submit:active { background: #cccccc; }
        .btn-reset {
            flex: 1;
            background: #1a1a1a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Archive List */
        .agenda-list { margin-top: 16px; }
        .agenda-list h4 {
            font-family: 'VT323', monospace;
            font-size: 18px;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .agenda-item {
            padding: 10px;
            border-radius: 2px;
            margin-bottom: 6px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .agenda-content h4 { margin: 0; font-size: 13px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; }
        .agenda-content p { margin: 2px 0 0 0; font-size: 10px; opacity: 0.85; font-family: monospace; }
        .completed { text-decoration: line-through; opacity: 0.3; }
        
        .agenda-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .agenda-actions input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .btn-delete {
            background: rgba(0, 0, 0, 0.6);
            color: #ff5555;
            border: 1px solid #ff5555;
            padding: 4px 6px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
        }
        .btn-delete:hover { background: #ff5555; color: white; }
        
        .footer-tag {
            text-align: center;
            font-family: 'VT323', monospace;
            font-size: 12px;
            color: var(--muted-gray);
            margin-top: 16px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Status Bar Supabase -->
    <div id="dbStatus">Menghubungkan ke Supabase Cloud...</div>

    <!-- Yorushika Eye Logo & Typography Header -->
    <div class="yorushika-header">
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <p class="jp-title-logo">ヨルシカ</p>
        <span class="sub-tag">Music & Schedule Archive</span>
    </div>
    
    <h2>Calendar</h2>

    <!-- Navigation -->
    <div class="calendar-nav">
        <button onclick="changeMonth(-1)">◀</button>
        <h3 id="monthYearDisplay"></h3>
        <button onclick="changeMonth(1)">▶</button>
    </div>

    <!-- Calendar Grid -->
    <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>

    <!-- Form Section -->
    <div class="form-section">
        <h4>+ Create Entry</h4>
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g., Spring Thief / Plagiarism">
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="type">
                <option value="Event">Event</option>
                <option value="Task">Task (With checkmark)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="date">
        </div>
        <div class="form-group">
            <label>Priority Tagging</label>
            <select id="priority">
                <option value="personal">Personal (Midnight Monotone)</option>
                <option value="professional">Professional (Deep Forest)</option>
                <option value="daily">Daily (Shadow Slate)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Timeblock Tagging</label>
            <select id="timeblock">
                <option value="morning">3am - 9am (Dawn Void)</option>
                <option value="work">9am - 5pm (Clear Gray)</option>
                <option value="night">5pm - 10pm (Eclipse Red)</option>
            </select>
        </div>
        <div class="form-buttons">
            <button class="btn-reset" onclick="resetForm()">Reset</button>
            <button class="btn-submit" onclick="addSchedule()">Save Entry</button>
        </div>
    </div>

    <!-- Archive List -->
    <div class="agenda-list">
        <h4>📋 Schedule Archive</h4>
        <div id="agendaContainer" style="font-size: 12px; color: var(--muted-gray);">No entries recorded yet.</div>
    </div>

    <div class="footer-tag">
        <span>― 夜を歩く者のための記録 ―</span>
    </div>
</div>

<script>
    // Konfigurasi Supabase (Tetap utuh)
    const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_u01IYdkiCB_VnoKYvcBzww_U3-cTiM8';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let schedules = [];

    const priorityColors = { 
        personal: '#1f2937',     
        professional: '#113822', 
        daily: '#333333'         
    };
    const timeblockColors = { 
        morning: '#2d1b4e',      
        work: '#1c3144',         
        night: '#4a1515'         
    };

    let currentDate = new Date();

    // Fungsi Ambil Data dari Supabase Cloud
    async function fetchSchedules() {
        const { data, error } = await supabaseClient
            .from('schedules')
            .select('*')
            .order('date', { ascending: true });

        const statusEl = document.getElementById('dbStatus');
        if (error) {
            statusEl.innerText = '⚠️ Gagal terhubung ke Cloud (Offline Mode)';
            statusEl.style.color = '#ff5555';
            schedules = JSON.parse(localStorage.getItem('yorushika_schedules')) || [];
        } else {
            statusEl.innerText = '☁️ Terhubung ke Supabase Cloud (Live)';
            statusEl.style.color = '#55ff55';
            schedules = data || [];
            localStorage.setItem('yorushika_schedules', JSON.stringify(schedules));
        }
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('monthYearDisplay').innerText = `${monthNames[month].toUpperCase()} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        // Ambil tanggal hari ini untuk perbandingan highlight
        const todayObj = new Date();
        const todayYear = todayObj.getFullYear();
        const todayMonth = todayObj.getMonth();
        const todayDate = todayObj.getDate();

        let gridHTML = '';

        for (let i = 0; i < firstDayIndex; i++) {
            gridHTML += `<div class="day-cell" style="background: transparent; border-color: transparent; cursor: default;"></div>`;
        }

        for (let day = 1; day <= totalDays; day++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

            // Cek apakah hari ini
            const isToday = (day === todayDate && month === todayMonth && year === todayYear);
            const todayClass = isToday ? 'today' : '';

            let daySchedules = schedules.filter(s => s.date === dateStr);
            let badgesHTML = '';
            daySchedules.forEach(s => {
                const c1 = priorityColors[s.priority] || '#333';
                const c2 = timeblockColors[s.timeblock] || '#333';
                badgesHTML += `<div class="mini-badge" style="background: linear-gradient(135deg, ${c1}, ${c2});">${s.title}</div>`;
            });

            gridHTML += `
                <div class="day-cell ${todayClass}" onclick="selectDate('${dateStr}')">
                    <span class="day-number">${day}</span>
                    <div>${badgesHTML}</div>
                </div>
            `;
        }

        document.getElementById('daysGrid').innerHTML = gridHTML;
        renderAgendaList();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function selectDate(dateStr) {
        document.getElementById('date').value = dateStr;
    }

    function resetForm() {
        document.getElementById('title').value = '';
        document.getElementById('date').value = '';
    }

    async function addSchedule() {
        const title = document.getElementById('title').value;
        const type = document.getElementById('type').value;
        const date = document.getElementById('date').value;
        const priority = document.getElementById('priority').value;
        const timeblock = document.getElementById('timeblock').value;

        if (!title || !date) {
            alert('Title and Date are required!');
            return;
        }

        const newEntry = {
            title, type, date, priority, timeblock,
            completed: false
        };

        const { error } = await supabaseClient.from('schedules').insert([newEntry]);
        
        if (error) {
            alert('Gagal menyimpan ke cloud: ' + error.message);
        } else {
            resetForm();
            fetchSchedules();
        }
    }

    async function toggleComplete(id) {
        const item = schedules.find(s => s.id === id);
        if (item) {
            const newStatus = !item.completed;
            const { error } = await supabaseClient
                .from('schedules')
                .update({ completed: newStatus })
                .eq('id', id);

            if (!error) fetchSchedules();
        }
    }

    async function deleteSchedule(id) {
        if (confirm('Delete this entry?')) {
            const { error } = await supabaseClient
                .from('schedules')
                .delete()
                .eq('id', id);

            if (!error) fetchSchedules();
        }
    }

    function renderAgendaList() {
        const container = document.getElementById('agendaContainer');
        if (schedules.length === 0) {
            container.innerHTML = 'No entries recorded yet.';
            return;
        }

        let html = '';
        schedules.forEach(s => {
            const c1 = priorityColors[s.priority] || '#333';
            const c2 = timeblockColors[s.timeblock] || '#333';
            const gradient = `linear-gradient(135deg, ${c1}, ${c2})`;

            html += `
                <div class="agenda-item" style="background: ${gradient};">
                    <div class="agenda-content">
                        <h4 class="${s.completed ? 'completed' : ''}">[${s.type}] ${s.title}</h4>
                        <p>📅 ${s.date} | 🏷️ ${s.priority} / ${s.timeblock}</p>
                    </div>
                    <div class="agenda-actions">
                        ${s.type === 'Task' ? `
                            <input type="checkbox" ${s.completed ? 'checked' : ''} onclick="toggleComplete(${s.id})" title="Mark complete">
                        ` : ''}
                        <button class="btn-delete" onclick="deleteSchedule(${s.id})">X</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    renderCalendar();
    fetchSchedules();
</script>

</body>
</html>
