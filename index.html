<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorushika Calendar // ヨルシカ</title>
    <!-- Favicon Resmi Yorushika -->
    <link rel="icon" type="image/png" href="https://yorushika.com/static/yorushika/official/feature/tour2022/images/ph_logo_PGWx6f7Q.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client UMD -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: VT323 & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-vt { font-family: 'VT323', monospace; }
    </style>
</head>
<body class="bg-[#050505] text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-[#0d0d0d] border-2 border-neutral-800 p-6 rounded-none shadow-2xl gap-4">
            <div class="text-center md:text-left">
                <div class="flex items-center justify-center md:justify-start gap-3">
                    <svg class="w-12 h-6 fill-white" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
                        <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
                        <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
                        <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
                    </svg>
                    <h1 class="text-3xl md:text-4xl font-bold tracking-widest font-vt text-white uppercase">ヨルシカ CALENDAR</h1>
                </div>
                <p class="text-xs text-neutral-400 font-vt tracking-widest mt-1">― 夜を歩く者のための記録 ―</p>
            </div>
            <div id="status-sync" class="text-xs bg-neutral-950 px-4 py-2 border border-neutral-800 font-vt text-base tracking-wider text-neutral-400">
                Menghubungkan ke database...
            </div>
        </header>

        <!-- Main Layout (Adaptif: Mobile Top-Down, Desktop 3 Kolom Kiri-Kanan) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Kolom Kiri: Form & Agenda Terpilih -->
            <div class="bg-[#0d0d0d] border-2 border-neutral-800 p-6 shadow-2xl space-y-6 lg:col-span-1 flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold text-white border-b border-neutral-800 pb-3 font-vt tracking-widest uppercase">TAMBAH / EDIT JADWAL</h2>
                    
                    <form id="schedule-form" class="space-y-4 mt-4">
                        <input type="hidden" id="schedule-id">
                        <div>
                            <label class="block text-xs font-medium text-neutral-400 mb-1 font-vt tracking-wider text-sm">JUDUL KEGIATAN</label>
                            <input type="text" id="title" required class="w-full bg-[#050505] border border-neutral-800 rounded-none px-3.5 py-2.5 text-sm focus:outline-none focus:border-white text-slate-100" placeholder="Contoh: Spring Thief">
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-neutral-400 mb-1 font-vt tracking-wider text-sm">DESKRIPSI / CATATAN (OPSIONAL)</label>
                            <input type="text" id="description" class="w-full bg-[#050505] border border-neutral-800 rounded-none px-3.5 py-2.5 text-sm focus:outline-none focus:border-white text-slate-100" placeholder="Detail singkat...">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-neutral-400 mb-1 font-vt tracking-wider text-sm">TANGGAL</label>
                                <input type="date" id="date" required class="w-full bg-[#050505] border border-neutral-800 rounded-none px-3.5 py-2.5 text-sm focus:outline-none focus:border-white text-slate-100">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-neutral-400 mb-1 font-vt tracking-wider text-sm">TIPE</label>
                                <select id="type" class="w-full bg-[#050505] border border-neutral-800 rounded-none px-3.5 py-2.5 text-sm focus:outline-none focus:border-white text-slate-100">
                                    <option value="Event">Event</option>
                                    <option value="Task">Task (Checklist)</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-neutral-400 mb-1 font-vt tracking-wider text-sm">PRIORITAS TAG</label>
                                <select id="priority" class="w-full bg-[#050505] border border-neutral-800 rounded-none px-3.5 py-2.5 text-sm focus:outline-none focus:border-white text-slate-100">
                                    <option value="personal">Personal (Mint)</option>
                                    <option value="professional">Professional (Maroon)</option>
                                    <option value="daily">Daily (Ink Charcoal)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-neutral-400 mb-1 font-vt tracking-wider text-sm">TIMEBLOCK</label>
                                <select id="timeblock" class="w-full bg-[#050505] border border-neutral-800 rounded-none px-3.5 py-2.5 text-sm focus:outline-none focus:border-white text-slate-100">
                                    <option value="morning">3am-9am (Golden)</option>
                                    <option value="work">9am-5pm (Olive)</option>
                                    <option value="night">5pm-10pm (Indigo)</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="save-btn" class="flex-1 bg-white hover:bg-neutral-200 text-black font-semibold py-2.5 transition text-sm shadow-lg font-vt text-lg tracking-wider">SIMPAN JADWAL</button>
                            <button type="button" id="cancel-edit" onclick="resetForm()" class="hidden bg-neutral-900 hover:bg-neutral-800 text-neutral-300 px-4 py-2.5 transition text-sm border border-neutral-800 font-vt text-lg">BATAL</button>
                        </div>
                    </form>
                </div>

                <div class="border-t border-neutral-800 pt-4 mt-4">
                    <h3 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider mb-3 font-vt tracking-widest text-sm">AGENDA TANGGAL DIPILIH</h3>
                    <div id="selected-date-agenda" class="space-y-2 max-h-52 overflow-y-auto text-sm text-neutral-400 pr-1">
                        <p class="italic text-xs text-neutral-500">Klik tanggal di kalender untuk melihat daftar agenda.</p>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Grid Kalender (2 Kolom di Desktop) -->
            <div class="bg-[#0d0d0d] border-2 border-neutral-800 p-6 shadow-2xl lg:col-span-2 flex flex-col">
                <!-- Navigasi Bulan -->
                <div class="flex justify-between items-center mb-6">
                    <h2 id="month-year-display" class="text-2xl font-bold font-vt text-white tracking-widest uppercase">BULAN TAHUN</h2>
                    <div class="flex gap-2">
                        <button onclick="changeMonth(-1)" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-300 px-3.5 py-2 transition border border-neutral-800 font-vt text-lg">&larr;</button>
                        <button onclick="goToCurrentMonth()" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-300 px-3 py-2 transition border border-neutral-800 font-vt text-lg tracking-wider">HARI INI</button>
                        <button onclick="changeMonth(1)" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-300 px-3.5 py-2 transition border border-neutral-800 font-vt text-lg">&rarr;</button>
                    </div>
                </div>

                <!-- Header Hari Kalender -->
                <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-neutral-500 mb-2 uppercase tracking-wider font-vt text-sm">
                    <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
                </div>

                <!-- Grid Kotak Tanggal Kalender -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-2 flex-1 auto-rows-fr">
                    <!-- Diisi lewat JavaScript -->
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logika & Supabase -->
    <script>
        const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_u01IYdkiCB_VnoKYvcBzww_U3-cTiM8';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let schedules = [];
        let currentDate = new Date();
        let selectedDateStr = null;

        // Pemetaan warna konsisten Yorushika
        const priorityColors = { 
            personal: '#7a9c72',     // Mint Green
            professional: '#800020', // Maroon
            daily: '#3b3b3b'         // Ink Charcoal
        };
        const timeblockColors = { 
            morning: '#d4af37',      // Golden Dawn
            work: '#4a5d3f',         // Summer Canopy (Olive)
            night: '#2b3a4a'         // Japanese Indigo
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchSchedules();
            document.getElementById('schedule-form').addEventListener('submit', handleFormSubmit);
        });

        async function fetchSchedules() {
            const statusEl = document.getElementById('status-sync');
            statusEl.innerText = "Mengambil data cloud...";
            
            const { data, error } = await supabaseClient
                .from('schedules')
                .select('*')
                .order('date', { ascending: true });

            if (error) {
                console.error('Error fetching:', error);
                statusEl.innerText = "Gagal terhubung ke database!";
                statusEl.className = "text-xs bg-red-950 text-red-400 px-4 py-2 border border-red-800 font-vt text-base tracking-wider";
            } else {
                schedules = data || [];
                statusEl.innerText = "Terhubung ke Supabase Cloud ☁️";
                statusEl.className = "text-xs bg-emerald-950 text-emerald-400 px-4 py-2 border border-emerald-800 font-vt text-base tracking-wider";
                renderCalendar();
                if (selectedDateStr) renderAgendaForDate(selectedDateStr);
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            document.getElementById('month-year-display').innerText = `${monthNames[month].toUpperCase()} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "bg-[#050505]/40 border border-neutral-900 min-h-[90px] opacity-20";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const cell = document.createElement('div');
                cell.className = "bg-[#050505] border border-neutral-800 hover:border-white p-2 min-h-[90px] flex flex-col justify-between transition cursor-pointer relative group";
                cell.onclick = () => selectDate(dateStr);

                const todayStr = new Date().toISOString().split('T')[0];
                let dayNumberClass = "text-sm font-bold font-vt text-neutral-400 tracking-wider";
                if (dateStr === todayStr) {
                    dayNumberClass += " bg-white text-black w-6 h-6 rounded-none flex items-center justify-center -ml-1 -mt-1";
                }

                cell.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="${dayNumberClass}">${day}</span>
                    </div>
                    <div class="space-y-1 overflow-hidden mt-1 flex-1" id="events-${dateStr}"></div>
                `;

                grid.appendChild(cell);
                renderEventsInCell(dateStr);
            }
        }

        function renderEventsInCell(dateStr) {
            const container = document.getElementById(`events-${dateStr}`);
            if (!container) return;

            const dayEvents = schedules.filter(s => s.date === dateStr);
            container.innerHTML = '';

            dayEvents.forEach(ev => {
                const badge = document.createElement('div');
                const c1 = priorityColors[ev.priority] || '#3b3b3b';
                const c2 = timeblockColors[ev.timeblock] || '#2b3a4a';
                const opacityStyle = ev.completed ? 'opacity: 0.2; text-decoration: line-through;' : '';

                badge.className = `text-[10px] px-1.5 py-0.5 border border-white/20 truncate text-white font-mono`;
                badge.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
                badge.style.cssText += opacityStyle;
                badge.innerText = ev.title;
                container.appendChild(badge);
            });
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function goToCurrentMonth() {
            currentDate = new Date();
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('date').value = dateStr;
            renderAgendaForDate(dateStr);
        }

        function renderAgendaForDate(dateStr) {
            const container = document.getElementById('selected-date-agenda');
            const dayEvents = schedules.filter(s => s.date === dateStr);

            if (dayEvents.length === 0) {
                container.innerHTML = `<p class="text-xs text-neutral-500 italic">Tidak ada agenda pada ${dateStr}.</p>`;
                return;
            }

            container.innerHTML = `<p class="text-xs font-semibold text-white mb-2 font-vt text-sm tracking-wider">📅 ${dateStr}</p>`;
            dayEvents.forEach(ev => {
                const item = document.createElement('div');
                item.className = "bg-[#050505] border border-neutral-800 p-2.5 flex items-center justify-between gap-2 text-xs";
                item.innerHTML = `
                    <div class="flex items-center gap-2 truncate">
                        ${ev.type === 'Task' ? `<input type="checkbox" ${ev.completed ? 'checked' : ''} onchange="toggleComplete('${ev.id}', ${!ev.completed})" class="rounded-none bg-neutral-900 border-neutral-700 text-white focus:ring-0 cursor-pointer">` : ''}
                        <span class="${ev.completed ? 'line-through text-neutral-600' : 'text-neutral-200'} truncate">${ev.title}</span>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        <button onclick="editSchedule('${ev.id}')" class="text-neutral-400 hover:text-white px-1">✏️</button>
                        <button onclick="deleteSchedule('${ev.id}')" class="text-neutral-400 hover:text-rose-400 px-1">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('schedule-id').value;
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const date = document.getElementById('date').value;
            const type = document.getElementById('type').value;
            const priority = document.getElementById('priority').value;
            const timeblock = document.getElementById('timeblock').value;

            const fullTitle = description ? `${title} (${description})` : title;

            if (id) {
                const { error } = await supabaseClient
                    .from('schedules')
                    .update({ title: fullTitle, date, type, priority, timeblock })
                    .eq('id', id);

                if (error) alert('Gagal memperbarui: ' + error.message);
            } else {
                const { error } = await supabaseClient
                    .from('schedules')
                    .insert([{ title: fullTitle, date, type, priority, timeblock, completed: false }]);

                if (error) alert('Gagal menyimpan: ' + error.message);
            }

            resetForm();
            fetchSchedules();
        }

        async function toggleComplete(id, status) {
            await supabaseClient.from('schedules').update({ completed: status }).eq('id', id);
            fetchSchedules();
        }

        function editSchedule(id) {
            const ev = schedules.find(s => s.id == id);
            if (!ev) return;

            document.getElementById('schedule-id').value = ev.id;
            document.getElementById('title').value = ev.title;
            document.getElementById('date').value = ev.date;
            document.getElementById('type').value = ev.type || 'Event';
            document.getElementById('priority').value = ev.priority;
            document.getElementById('timeblock').value = ev.timeblock;

            document.getElementById('save-btn').innerText = "PERBARUI JADWAL";
            document.getElementById('cancel-edit').classList.remove('hidden');
        }

        async function deleteSchedule(id) {
            if (confirm('Yakin ingin menghapus agenda ini?')) {
                await supabaseClient.from('schedules').delete().eq('id', id);
                fetchSchedules();
            }
        }

        function resetForm() {
            document.getElementById('schedule-form').reset();
            document.getElementById('schedule-id').value = '';
            document.getElementById('save-btn').innerText = "SIMPAN JADWAL";
            document.getElementById('cancel-edit').classList.add('hidden');
        }
    </script>
</body>
</html>
