<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorushika Calendar - Productivity Suite</title>
    <!-- Google Fonts: VT323 (Pixel/Monospace) & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #0d0d0d;
            --surface-card: #141414;
            --border-color: #222222;
            --text-primary: #ededed;
            --text-secondary: #888888;
            --accent-yorushika: #3a86ff;
            --accent-dim: #1a2332;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area svg {
            width: 32px;
            height: 32px;
            fill: var(--text-primary);
        }

        h1 {
            font-family: 'VT323', monospace;
            font-size: 32px;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            flex: 1;
        }

        @media(max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Panel Kiri: Form & Daftar Agenda */
        .sidebar-panel {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        input, select, textarea {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-yorushika);
        }

        button {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        /* Daftar Agenda List */
        .agenda-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        /* Card Agenda Sesuai Konsep Baru */
        .agenda-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--accent-yorushika);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            transition: all 0.3s ease;
        }

        .agenda-header-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .agenda-title-area {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .agenda-title-area input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-yorushika);
        }

        .agenda-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
        }

        .agenda-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            background: #222;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .agenda-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            margin-top: 4px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 8px;
        }

        .btn-action {
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .btn-action:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .btn-reschedule {
            color: #ffb703;
            border-color: rgba(255, 183, 3, 0.3);
        }
        .btn-reschedule:hover {
            background: rgba(255, 183, 3, 0.1);
            color: #ffb703;
        }

        /* Efek Dimmed Saat Dicentang (Selesai) */
        .agenda-card.completed {
            opacity: 0.35;
            background-color: #0b0b0b;
            border-left-color: #444 !important;
        }
        .agenda-card.completed .agenda-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        /* Panel Kanan: Kalender Grid */
        .calendar-panel {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .calendar-nav-btns {
            display: flex;
            gap: 8px;
        }

        .calendar-nav-btns button {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 14px;
        }

        .calendar-grid-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(90px, 1fr);
            gap: 4px;
            flex: 1;
        }

        .calendar-cell {
            background-color: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .calendar-cell:hover {
            border-color: var(--text-secondary);
        }

        .calendar-cell.active-date {
            border-color: var(--accent-yorushika);
            background-color: var(--accent-dim);
        }

        .calendar-cell.other-month {
            opacity: 0.3;
        }

        .cell-date-num {
            font-size: 13px;
            font-weight: 600;
        }

        .cell-indicators {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            max-height: 24px;
            overflow: hidden;
        }

        .dot-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-yorushika);
        }

        /* Sinkronisasi Grid Kalender Redup (Dimmed jika semua tugas hari itu selesai) */
        .dot-indicator.dimmed-dot {
            opacity: 0.25;
            background-color: #555 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <!-- Yorushika-inspired minimalist geometric logo SVG -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 22h20L12 2zm0 4l7.5 14h-15L12 6z"/>
            </svg>
            <h1>YORUSHIKA CALENDAR</h1>
        </div>
        <div id="current-date-label" style="font-size: 14px; color: var(--text-secondary);"></div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Kiri: Input & Daftar Agenda Tanggal Terpilih -->
        <div class="sidebar-panel">
            <div>
                <div class="section-title" id="selected-date-title">Agenda Hari Ini</div>
                <form id="agenda-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="edit-id" value="">
                    <div class="form-group">
                        <label>Judul Kegiatan</label>
                        <input type="text" id="title-input" placeholder="Contoh: Rilis album / Coding project..." required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div class="form-group">
                            <label>Tanggal (YYYY-MM-DD)</label>
                            <input type="text" id="date-input" placeholder="2026-07-26" required>
                        </div>
                        <div class="form-group">
                            <label>Tipe</label>
                            <select id="type-input">
                                <option value="event">Event</option>
                                <option value="task">Task</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div class="form-group">
                            <label>Timeblock</label>
                            <select id="timeblock-input">
                                <option value="Morning">Morning</option>
                                <option value="Work">Work</option>
                                <option value="Night">Night</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Prioritas</label>
                            <select id="priority-input">
                                <option value="Personal">Personal</option>
                                <option value="Professional">Professional</option>
                                <option value="Daily">Daily</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" style="width: 100%; margin-top: 8px;">Simpan Agenda</button>
                </form>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color);">

            <div style="display: flex; flex-direction: column; flex: 1; min-height: 250px;">
                <div class="section-title">Daftar Agenda Tanggal Ini</div>
                <div class="agenda-list" id="agenda-list-container">
                    <!-- Dynamic Agenda Cards -->
                </div>
            </div>
        </div>

        <!-- Panel Kanan: Kalender Grid Utama -->
        <div class="calendar-panel">
            <div class="calendar-header">
                <h2 id="calendar-month-year" style="font-size: 20px; font-weight: 600;">Juli 2026</h2>
                <div class="calendar-nav-btns">
                    <button onclick="changeMonth(-1)">&lt;</button>
                    <button onclick="goToToday()">Hari Ini</button>
                    <button onclick="changeMonth(1)">&gt;</button>
                </div>
            </div>

            <div class="calendar-grid-header">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
            </div>

            <div class="calendar-grid" id="calendar-grid-cells">
                <!-- Dynamic Grid Cells -->
            </div>
        </div>
    </div>

    <script>
        // State Aplikasi (Menggunakan LocalStorage agar aman & instan)
        let agendas = JSON.parse(localStorage.getItem('yorushika_agendas')) || [
            { id: '1', title: 'Rilis Single Baru - Tsuki ni Kawaru', date: '2026-07-26', type: 'event', timeblock: 'Night', priority: 'Professional', completed: false },
            { id: '2', title: 'Review Database Supabase Schema', date: '2026-07-25', type: 'task', timeblock: 'Work', priority: 'Personal', completed: true }
        ];

        let today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth(); // 0-11
        let selectedDateStr = formatDateObj(today);

        // Warna aksen berdasarkan Prioritas/Timeblock untuk Border-Left Card
        const priorityColors = {
            'Personal': '#3a86ff',
            'Professional': '#ff006e',
            'Daily': '#8338ec'
        };

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('date-input').value = selectedDateStr;
            renderCalendar();
            renderAgendaList();
        });

        function formatDateObj(d) {
            let year = d.getFullYear();
            let month = String(d.getMonth() + 1).padStart(2, '0');
            let day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Render Kalender Grid
        function renderCalendar() {
            const gridContainer = document.getElementById('calendar-grid-cells');
            gridContainer.innerHTML = '';

            const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            document.getElementById('calendar-month-yearinnerText', (document.getElementById('calendar-month-year').innerText = `${monthNames[currentMonth]} ${currentYear}`));

            let firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            let prevTotalDays = new Date(currentYear, currentMonth, 0).getDate();

            let cellsHtml = '';

            // Hari dari bulan sebelumnya
            for (let i = firstDayIndex; i > 0; i--) {
                let dayNum = prevTotalDays - i + 1;
                let dStr = `${currentMonth === 0 ? currentYear - 1 : currentYear}-${String(currentMonth === 0 ? 12 : currentMonth).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                cellsHtml += createCellHtml(dStr, dayNum, true);
            }

            // Hari bulan aktif
            for (let i = 1; i <= totalDays; i++) {
                let dStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                let isActive = (dStr === selectedDateStr) ? 'active-date' : '';
                cellsHtml += createCellHtml(dStr, i, false, isActive);
            }

            gridContainer.innerHTML = cellsHtml;
        }

        function createCellHtml(dateStr, dayNum, isOtherMonth = false, activeClass = '') {
            let dayAgendas = agendas.filter(a => a.date === dateStr);
            let indicatorsHtml = '';

            if (dayAgendas.length > 0) {
                // Cek apakah SEMUA agenda di tanggal ini sudah selesai (completed)
                let allCompleted = dayAgendas.every(a => a.completed);
                
                indicatorsHtml = '<div class="cell-indicators">';
                dayAgendas.forEach(a => {
                    let color = priorityColors[a.priority] || '#3a86ff';
                    let dimmedClass = allCompleted ? 'dimmed-dot' : '';
                    indicatorsHtml += `<div class="dot-indicator ${dimmedClass}" style="background-color: ${color};" title="${a.title}"></div>`;
                });
                indicatorsHtml += '</div>';
            }

            return `
                <div class="calendar-cell ${isOtherMonth ? 'other-month' : ''} ${activeClass}" onclick="selectDate('${dateStr}')">
                    <div class="cell-date-num">${dayNum}</div>
                    ${indicatorsHtml}
                </div>
            `;
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('date-input').value = dateStr;
            document.getElementById('selected-date-title').innerText = `Agenda Tanggal: ${dateStr}`;
            renderCalendar();
            renderAgendaList();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function goToToday() {
            let now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            selectDate(formatDateObj(now));
        }

        // Render List Agenda untuk Tanggal yang Dipilih
        function renderAgendaList() {
            const container = document.getElementById('agenda-list-container');
            let filtered = agendas.filter(a => a.date === selectedDateStr);

            document.getElementById('selected-date-title').innerText = `Agenda (${selectedDateStr})`;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="font-size: 13px; color: var(--text-secondary); text-align: center; padding: 20px;">Belum ada agenda di tanggal ini.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                let borderColor = priorityColors[item.priority] || '#3a86ff';
                let completedClass = item.completed ? 'completed' : '';
                let isChecked = item.completed ? 'checked' : '';
                
                // Cek apakah jadwal sudah lewat dari hari ini tapi belum selesai (untuk tombol Reschedule)
                let todayStr = formatDateObj(new Date());
                let showReschedule = (!item.completed && item.date < todayStr);

                html += `
                    <div class="agenda-card ${completedClass}" style="border-left-color: ${borderColor};">
                        <div class="agenda-header-row">
                            <div class="agenda-title-area">
                                <input type="checkbox" ${isChecked} onclick="toggleComplete('${item.id}')">
                                <span class="agenda-title">${escapeHtml(item.title)}</span>
                            </div>
                        </div>
                        <div class="agenda-badges">
                            <span class="badge">${item.type}</span>
                            <span class="badge">${item.timeblock}</span>
                            <span class="badge" style="color: ${borderColor};">${item.priority}</span>
                        </div>
                        <div class="agenda-actions">
                            ${showReschedule ? `<button class="btn-action btn-reschedule" onclick="rescheduleAgenda('${item.id}')">📅 Reschedule ke Hari Ini</button>` : ''}
                            <button class="btn-action" onclick="editAgenda('${item.id}')">Edit</button>
                            <button class="btn-action" onclick="deleteAgenda('${item.id}')" style="color: #ff4d4d;">Hapus</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Tambah atau Edit Agenda via Form
        function handleFormSubmit(event) {
            event.preventDefault();
            let editId = document.getElementById('edit-id').value;
            let title = document.getElementById('title-input').value;
            let date = document.getElementById('date-input').value;
            let type = document.getElementById('type-input').value;
            let timeblock = document.getElementById('timeblock-input').value;
            let priority = document.getElementById('priority-input').value;

            if (editId) {
                let item = agendas.find(a => a.id === editId);
                if (item) {
                    item.title = title;
                    item.date = date;
                    item.type = type;
                    item.timeblock = timeblock;
                    item.priority = priority;
                }
                document.getElementById('edit-id').value = '';
                document.getElementById('submit-btn').innerText = 'Simpan Agenda';
            } else {
                let newItem = {
                    id: Date.now().toString(),
                    title,
                    date,
                    type,
                    timeblock,
                    priority,
                    completed: false
                };
                agendas.push(newItem);
            }

            saveAndRefresh();
            document.getElementById('title-input').value = '';
        }

        // Toggle Status Selesai (Memicu Efek Dimmed & Sinkronisasi Grid)
        function toggleComplete(id) {
            let item = agendas.find(a => a.id === id);
            if (item) {
                item.completed = !item.completed;
                saveAndRefresh();
            }
        }

        // Fitur Reschedule Agenda Terlewat ke Hari Ini
        function rescheduleAgenda(id) {
            let item = agendas.find(a => a.id === id);
            if (item) {
                let todayStr = formatDateObj(new Date());
                item.date = todayStr;
                saveAndRefresh();
                selectDate(todayStr);
            }
        }

        function editAgenda(id) {
            let item = agendas.find(a => a.id === id);
            if (item) {
                document.getElementById('edit-id').value = item.id;
                document.getElementById('title-input').value = item.title;
                document.getElementById('date-input').value = item.date;
                document.getElementById('type-input').value = item.type;
                document.getElementById('timeblock-input').value = item.timeblock;
                document.getElementById('priority-input').value = item.priority;
                document.getElementById('submit-btn').innerText = 'Update Agenda';
            }
        }

        function deleteAgenda(id) {
            agendas = agendas.filter(a => a.id !== id);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('yorushika_agendas', JSON.stringify(agendas));
            renderCalendar();
            renderAgendaList();
        }

        function escapeHtml(text) {
            let map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
