<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorushika Calendar // ヨルシカ</title>
    <link rel="icon" type="image/png" href="https://yorushika.com/static/yorushika/official/feature/tour2022/images/ph_logo_PGWx6f7Q.png">
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Yorushika%20Calendar%22%2C%22short_name%22%3A%22Yorushika%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23050505%22%2C%22theme_color%22%3A%22%23050505%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fyorushika.com%2Fstatic%2Fyorushika%2Fofficial%2Ffeature%2Ftour2022%2Fimages%2Fph_logo_PGWx6f7Q.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <link rel="apple-touch-icon" href="https://yorushika.com/static/yorushika/official/feature/tour2022/images/ph_logo_PGWx6f7Q.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --forceLowercase: true;
            --cleanSpacing: true;
            --main-font: 'Syne', sans-serif;
            --bg-pure: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --text-main: #e6e6e6;
            --muted-gray: #737373;
            --birthday-strawberry: #ff4d6d;
            --habit-badge-bg: #3a506b;
            --discord-badge-bg: #1e1f22;
            --discord-badge-border: #35363c;
        }
        
        body, input, select, textarea, button {
            font-family: var(--main-font);
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            text-transform: var(--forceLowercase ? lowercase : uppercase);
        }

        /* Force lowercase global application if enabled */
        body, input, select, textarea, button, h2, h3, h4, label, span, p {
            text-transform: lowercase !important;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 2px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .mobile-create-trigger {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            margin-bottom: 4px;
        }
        .mobile-create-trigger:hover { background: #e0e0e0; }

        @media (min-width: 1100px) {
            .container {
                max-width: 1450px;
                display: grid;
                grid-template-columns: 420px 1fr 380px;
                grid-template-rows: auto auto auto;
                gap: 20px;
                align-items: start;
            }
            .desktop-full-span { grid-column: span 3; }
            .desktop-agenda-column { grid-column: 1; grid-row: 2 / span 2; }
            .desktop-calendar-column { grid-column: 2; grid-row: 2 / span 2; }
            .desktop-form-column { grid-column: 3; grid-row: 2 / span 2; margin-top: 0 !important; display: block !important; }
            .mobile-create-trigger { display: none !important; }
        }
        
        #dbStatus {
            font-size: 12px;
            text-align: center;
            padding: 5px;
            border: 1px dashed var(--border-color);
            background: #000;
        }
        
        .yorushika-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            position: relative;
        }
        .eye-logo-svg {
            width: 70px;
            height: 35px;
            fill: #ffffff;
            margin-bottom: 6px;
        }
        .jp-title-logo {
            font-size: 24px;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0;
        }
        .sub-tag {
            font-size: 9px;
            color: var(--muted-gray);
            letter-spacing: 2px;
        }

        .btn-logout {
            position: absolute;
            top: 0;
            right: 0;
            background: #1a1a1a;
            color: #ff5555;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 9px;
            cursor: pointer;
        }
        .btn-logout:hover { background: #ff5555; color: #fff; }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            font-size: 22px;
            letter-spacing: 3px;
            margin: 0 0 10px 0; 
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }
        
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #000000;
            padding: 8px;
            border: 1px solid var(--border-color);
        }
        .calendar-nav-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .calendar-nav h3 {
            font-size: 16px;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
        }
        .calendar-nav button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .calendar-nav button:hover { background: #ffffff; color: #000000; }
        .btn-calendar-today {
            background: #1a1a1a !important;
            color: #4da6ff !important;
            border: 1px solid #4da6ff !important;
            font-size: 9px !important;
            padding: 3px 6px !important;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-calendar-today:hover { background: #4da6ff !important; color: #000 !important; }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            color: var(--muted-gray);
            margin-bottom: 4px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            height: 75px; 
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 1px;
            padding: 3px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .day-cell:hover { border-color: #ffffff; background: #111111; }
        .day-cell.today {
            border: 1px solid #ffffff;
            background: #141414;
        }
        .day-cell.today .day-number {
            color: #ffffff;
            text-decoration: underline;
        }
        .day-number { font-weight: bold; color: var(--muted-gray); font-size: 13px; }
        
        .badges-container {
            max-height: 45px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .mini-badge {
            font-size: 8px;
            color: #ffffff;
            padding: 1px 3px;
            border-radius: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .mini-badge.completed-badge {
            opacity: 0.35;
            text-decoration: line-through;
        }

        .pill-badges-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }
        .discord-pill {
            background: var(--discord-badge-bg);
            border: 1px solid var(--discord-badge-border);
            color: #b5bac1;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .discord-pill.time-pill { color: #f2f3f5; border-color: #4e5058; }
        .discord-pill.label-pill { color: #dbdee1; }

        .form-section {
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            display: none;
        }
        .form-section h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 9px; color: var(--muted-gray); }
        
        .date-input-wrapper {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .date-input-wrapper input {
            flex-grow: 1;
        }
        .btn-date-action {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 7px 10px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
            white-space: nowrap;
        }
        .btn-date-action:hover { background: #fff; color: #000; }
        .btn-date-action.delete-mode {
            color: #ff5555;
            border-color: #ff5555;
        }
        .btn-date-action.delete-mode:hover {
            background: #ff5555;
            color: #fff;
        }

        input, select, textarea {
            width: 100%;
            padding: 7px;
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 11px;
        }
        select option { text-transform: lowercase; }
        textarea { resize: vertical; min-height: 50px; white-space: pre-wrap; }
        input:focus, select:focus, textarea:focus { outline: 1px solid #ffffff; }
        
        .form-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-submit {
            flex: 2;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-reset {
            flex: 1;
            background: #1a1a1a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .agenda-list { 
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            margin-bottom: 12px;
        }
        .agenda-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }
        .agenda-list h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
        }
        .agenda-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .sort-select {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
            width: auto;
        }
        .btn-clear-filter {
            background: #1a1a1a;
            color: #ff5555;
            border: 1px solid var(--border-color);
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
        }
        .btn-clear-filter:hover { background: #ff5555; color: #fff; }

        .archive-windows-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .btn-window-trigger {
            background: #141414;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            font-size: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .btn-window-trigger:hover { background: #ffffff; color: #000000; }

        .nav-counter-badge {
            background: #ffffff;
            color: #000000;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 10px;
            margin-left: 2px;
            display: inline-block;
            vertical-align: middle;
        }
        .btn-window-trigger:hover .nav-counter-badge {
            background: #000000;
            color: #ffffff;
        }
        .nav-counter-badge.red-alert {
            background: #ff4d6d;
            color: #ffffff;
        }
        .btn-window-trigger:hover .nav-counter-badge.red-alert {
            background: #ffffff;
            color: #ff4d6d;
        }

        .dumplist-box {
            background: #080808;
            border: 1px dashed var(--border-color);
            padding: 8px;
            margin-top: 10px;
        }
        .dumplist-title {
            font-size: 12px;
            color: var(--muted-gray);
            margin-bottom: 6px;
            border-bottom: 1px dotted var(--border-color);
            padding-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }

        .section-category-box {
            background: #060606;
            border: 1px solid var(--border-color);
            padding: 8px;
            margin-bottom: 8px;
        }
        .section-category-title {
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        
        .agenda-item {
            padding: 8px;
            border-radius: 2px;
            margin-bottom: 5px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
        }
        .agenda-item:hover { border-color: #ffffff; }
        
        .agenda-item.completed-item {
            opacity: 0.35 !important;
            border-style: dashed;
        }
        .agenda-item.completed-item .agenda-content h4,
        .agenda-item.completed-item .agenda-content p {
            text-decoration: line-through !important;
        }
        
        .agenda-content {
            flex-grow: 1;
            overflow: hidden;
            padding-right: 8px;
        }
        .agenda-content h4 { 
            margin: 0; font-size: 11px; font-weight: 600; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .agenda-content p { 
            margin: 2px 0 0 0; font-size: 9px; opacity: 0.85; 
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis; white-space: normal; word-break: break-all; 
        }
        
        .agenda-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .agenda-actions input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
        .btn-assign {
            background: rgba(0, 0, 0, 0.6);
            color: #4da6ff;
            border: 1px solid #4da6ff;
            padding: 3px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-assign:hover { background: #4da6ff; color: black; }
        .btn-edit {
            background: rgba(0, 0, 0, 0.6);
            color: #55ff55;
            border: 1px solid #55ff55;
            padding: 3px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-edit:hover { background: #55ff55; color: black; }
        .btn-delete {
            background: rgba(0, 0, 0, 0.6);
            color: #ff5555;
            border: 1px solid #ff5555;
            padding: 3px 4px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-delete:hover { background: #ff5555; color: white; }
        .btn-order {
            background: rgba(0, 0, 0, 0.6);
            color: #ffcc00;
            border: 1px solid #ffcc00;
            padding: 3px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-order:hover { background: #ffcc00; color: black; }

        .btn-overflow-more {
            display: block;
            width: 100%;
            background: #141414;
            color: #fff;
            border: 1px dashed var(--border-color);
            padding: 5px;
            font-size: 9px;
            text-align: center;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-overflow-more:hover { background: #262626; border-color: #fff; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #0d0d0d;
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            font-size: 15px;
            color: #fff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-scroll-body {
            overflow-y: auto;
            max-height: calc(80vh - 60px);
            padding-right: 4px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-body p {
            margin: 6px 0;
            font-size: 11px;
            white-space: pre-wrap;
        }
        .modal-body strong {
            color: var(--muted-gray);
            font-size: 9px;
            display: block;
        }

        .editable-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .editable-pill {
            background: #2b2d31;
            border: 1px solid #383a40;
            color: #f2f3f5;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .editable-pill .remove-pill {
            cursor: pointer;
            color: #ed4245;
            font-weight: bold;
            font-size: 10px;
        }
        .editable-pill .remove-pill:hover { color: #ff6b6b; }

        /* Login Wall Overlay Styles */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.96);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }
        .auth-box {
            background: var(--card-bg);
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            border-radius: 2px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            text-align: center;
        }
        .auth-box h3 {
            color: #fff;
            font-size: 18px;
            letter-spacing: 2px;
            margin: 10px 0 15px 0;
        }
        #authErrorMsg {
            font-size: 10px;
            color: #ff5555;
            margin-top: 8px;
            min-height: 15px;
        }

        .footer-tag {
            text-align: center;
            font-size: 11px;
            color: var(--muted-gray);
            margin-top: 10px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- Login Wall Overlay -->
<div id="authOverlay" style="display: none;">
    <div class="auth-box">
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" style="width: 50px; height: 25px; margin: 0 auto 10px auto; display: block;">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <h3>system access</h3>
        <div class="form-group" style="text-align: left;">
            <label>email address</label>
            <input type="email" id="authEmail" placeholder="your@email.com">
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 12px;">
            <label>password</label>
            <input type="password" id="authPassword" placeholder="••••••••">
        </div>
        <button class="btn-submit" style="width: 100%; padding: 10px;" onclick="handleLogin()">sign in to vault</button>
        <div id="authErrorMsg"></div>
    </div>
</div>

<div class="container">
    <div class="yorushika-header desktop-full-span">
        <button class="btn-logout" onclick="handleLogout()">logout</button>
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <p class="jp-title-logo">ヨルシカ</p>
        <span class="sub-tag">music & schedule archive</span>
    </div>
    
    <div class="desktop-calendar-column">
        <h2>calendar</h2>

<script>
    const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_u01IYdkiCB_VnoKYvcBzww_U3-cTiM8';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true },
        db: { schema: 'public' },
        global: { headers: { 'x-client-info': 'yorushika-calendar' } }
    });

    let schedules = [];
    let selectedFilterDate = null;
    let isHabitOrderMode = false;

    const priorityColors = { personal: '#7a9c72', professional: '#800020', daily: '#3b3b3b' };
    const timeblockColors = { none: '#555555', morning: '#8c6d36', work: '#4f5d2f', night: '#1b263b' };
    
    // Timeblock order: 'none' (when matching today/specific date) gets highest priority, then morning, work, night
    const timeblockOrder = { none: 0, morning: 1, work: 2, night: 3 };
    const priorityOrder = { professional: 1, daily: 2, personal: 3 };
    const typeOrder = { Task: 1, Event: 2, Habit: 3, Birthday: 4 };

    let currentDate = new Date();

    function getTodayString() {
        const nowLocal = new Date();
        return `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;
    }

    function updateDateActionBtn(inputId, btnId) {
        const inputVal = document.getElementById(inputId).value;
        const btn = document.getElementById(btnId);
        if (!btn) return;
        if (inputVal) {
            btn.innerText = '×';
            btn.classList.add('delete-mode');
            btn.title = 'clear date';
        } else {
            btn.innerText = 'today';
            btn.classList.remove('delete-mode');
            btn.title = 'set to today';
        }
    }

    function handleDateActionBtn(inputId, btnId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(btnId);
        if (!input || !btn) return;

        if (input.value) {
            input.value = '';
        } else {
            input.value = getTodayString();
        }
        updateDateActionBtn(inputId, btnId);
    }

    // Fungsi Login & Logout Handlers
    async function handleLogin() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const errorEl = document.getElementById('authErrorMsg');

        if (!email || !password) {
            errorEl.innerText = 'email and password required!';
            return;
        }

        errorEl.innerText = 'authenticating...';
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            errorEl.innerText = error.message;
        } else {
            errorEl.innerText = '';
            document.getElementById('authOverlay').style.display = 'none';
            fetchSchedules();
        }
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
        document.getElementById('authOverlay').style.display = 'flex';
    }

    async function checkAuthAndInit() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            document.getElementById('authOverlay').style.display = 'flex';
        } else {
            document.getElementById('authOverlay').style.display = 'none';
            fetchSchedules();
        }
    }

    function showModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.style.display = 'flex';
        setTimeout(() => { modal.classList.add('active'); }, 10);
    }

    function hideModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            ['formModal', 'assignModal', 'detailModal', 'directoryModal'].forEach(modalId => {
                const el = document.getElementById(modalId);
                if (el && el.classList.contains('active')) {
                    hideModal(modalId);
                }
            });
        }
    });

    function parseTodoistTitle(rawTitle) {
        if (!rawTitle) return { cleanTitle: '', timeTags: [], labelTags: [] };

        const timeRegex = /\b(\d{1,2}(?:am|pm)|\d{1,2}:\d{2})\b/gi;
        const labelRegex = /\B(\.[a-zA-Z0-9_-]+)/g;

        let timeTags = [];
        let labelTags = [];

        let match;
        while ((match = timeRegex.exec(rawTitle)) !== null) {
            timeTags.push(match[1].toLowerCase());
        }
        while ((match = labelRegex.exec(rawTitle)) !== null) {
            labelTags.push(match[1].substring(1));
        }

        let cleanTitle = rawTitle.replace(timeRegex, '').replace(labelRegex, '').replace(/\s+/g, ' ').trim();

        return { cleanTitle, timeTags, labelTags };
    }

    function formatDateDDMM(dateStr) {
        if (!dateStr) return '';
        if (dateStr.includes('-')) {
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}`;
            if (parts.length === 2) return `${parts[1]}/${parts[0]}`;
        }
        return dateStr;
    }

    function handleTypeChange() {
        const typeVal = document.getElementById('type').value;
        const priorityGrp = document.getElementById('priorityGroup');
        const timeblockGrp = document.getElementById('timeblockGroup');
        const dateGrp = document.getElementById('dateGroup');
        const dateLbl = document.getElementById('dateLabel');
        const dateInput = document.getElementById('date');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'birthday date (dd/mm)';
            dateInput.type = 'date';
        } else if (typeVal === 'Habit') {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'none';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'date (leave blank for inbox)';
            dateInput.type = 'date';
        }
    }

    function m_handleTypeChange() {
        const typeVal = document.getElementById('m_type').value;
        const priorityGrp = document.getElementById('m_priorityGroup');
        const timeblockGrp = document.getElementById('m_timeblockGroup');
        const dateGrp = document.getElementById('m_dateGroup');
        const dateLbl = document.getElementById('m_dateLabel');
        const dateInput = document.getElementById('m_date');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'birthday date (dd/mm)';
            dateInput.type = 'date';
        } else if (typeVal === 'Habit') {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'none';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'date (leave blank for inbox)';
            dateInput.type = 'date';
        }
    }

    async function fetchSchedules() {
        const statusEl = document.getElementById('dbStatus');
        statusEl.innerText = 'menghubungkan ke supabase cloud...';
        statusEl.style.color = '#e6e6e6';

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);

            const { data, error } = await supabaseClient
                .from('schedules')
                .select('*')
                .order('date', { ascending: true, nullsFirst: false })
                .abortSignal(controller.signal);

            clearTimeout(timeoutId);

            if (error) {
                if (error.code === 'PGRST301' || error.message.includes('JWT')) {
                    handleLogout();
                    return;
                }
                throw error;
            }

            statusEl.innerText = '☁️ terhubung ke supabase cloud (live)';
            statusEl.style.color = '#55ff55';
            schedules = data || [];
            localStorage.setItem('yorushika_schedules', JSON.stringify(schedules));
        } catch (err) {
            console.warn('Supabase fetch error/timeout:', err);
            statusEl.innerText = '⚠️ gagal terhubung ke cloud (offline / cached mode)';
            statusEl.style.color = '#ff5555';
            schedules = JSON.parse(localStorage.getItem('yorushika_schedules')) || [];
        }

        updateArchiveCounters();
        renderCalendar();
    }

    function updateArchiveCounters() {
        const todayStr = getTodayString();

        const birthdayCount = schedules.filter(s => s.type === 'Birthday').length;
        const habitCount = schedules.filter(s => s.type === 'Habit').length;
        const skippedCount = schedules.filter(s => s.type === 'Task' && !s.isHabitInstance && s.date && s.date < todayStr && !s.completed).length;
        
        let allLabels = new Set();
        schedules.forEach(s => {
            const parsed = parseTodoistTitle(s.title);
            parsed.labelTags.forEach(l => allLabels.add(l));
        });

        document.getElementById('birthdayBadgeCount').innerText = birthdayCount;
        document.getElementById('habitBadgeCount').innerText = habitCount;
        
        const skippedBadge = document.getElementById('skippedBadgeCount');
        skippedBadge.innerText = skippedCount;
        if (skippedCount > 0) {
            skippedBadge.classList.add('red-alert');
        } else {
            skippedBadge.classList.remove('red-alert');
        }

        document.getElementById('labelBadgeCount').innerText = allLabels.size;
    }

    function sortItems(items) {
        const sortBy = document.getElementById('sortBySelect').value;
        const todayStr = getTodayString();

        return [...items].sort((a, b) => {
            if (a.completed && !b.completed) return 1;
            if (!a.completed && b.completed) return -1;

            // Rule: 'none' timeblock on today or specific date has higher priority over morning/work/night
            const getEffectiveTbOrder = (item) => {
                let tb = item.timeblock || 'none';
                if (tb === 'none' && item.date && item.date >= todayStr) {
                    return -1; // highest priority
                }
                return timeblockOrder[tb] ?? 2;
            };

            if (sortBy === 'priority') {
                let pDiff = (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
                if (pDiff !== 0) return pDiff;
                return getEffectiveTbOrder(a) - getEffectiveTbOrder(b);
            } else if (sortBy === 'type') {
                let tDiff = (typeOrder[a.type] || 2) - (typeOrder[b.type] || 2);
                if (tDiff !== 0) return tDiff;
                let tbDiff = getEffectiveTbOrder(a) - getEffectiveTbOrder(b);
                if (tbDiff !== 0) return tbDiff;
                return (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
            } else {
                let tbDiff = getEffectiveTbOrder(a) - getEffectiveTbOrder(b);
                if (tbDiff !== 0) return tbDiff;
                return (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
            }
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
        document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        let gridHTML = '';
        for (let i = 0; i < firstDayIndex; i++) {
            gridHTML += `<div class="day-cell" style="background: transparent; border-color: transparent; cursor: default;"></div>`;
        }

        const todayStr = getTodayString();

        for (let day = 1; day <= totalDays; day++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

            let daySchedules = schedules.filter(s => {
                if (!s.date) return false;
                if (s.date === dateStr) return true;
                if (s.type === 'Birthday' || s.recurring === 'yearly') {
                    const bMonth = s.date.split('-')[1];
                    const bDay = s.date.split('-')[2];
                    return bMonth === formattedMonth && bDay === formattedDay;
                }
                return false;
            });

            daySchedules = sortItems(daySchedules);

            let badgesHTML = '';
            daySchedules.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                
                const isPast = s.date && s.date < todayStr;
                const completedClass = (s.completed && isPast) ? 'completed-badge' : (s.completed && s.type === 'Task' ? 'completed-badge' : '');
                
                const parsed = parseTodoistTitle(s.title);
                badgesHTML += `<div class="mini-badge ${completedClass}" style="background: ${bgStyle};">${parsed.cleanTitle}</div>`;
            });

            const isToday = (dateStr === todayStr) ? 'today' : '';
            gridHTML += `
                <div class="day-cell ${isToday}" onclick="handleGridCellClick('${dateStr}')">
                    <span class="day-number">${day}</span>
                    <div class="badges-container">${badgesHTML}</div>
                </div>
            `;
        }

        document.getElementById('daysGrid').innerHTML = gridHTML;
        renderAgendaList();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function goToCurrentMonth() {
        currentDate = new Date();
        renderCalendar();
    }

    function handleGridCellClick(dateStr) {
        document.getElementById('date').value = dateStr;

        document.getElementById('m_date').value = dateStr;
        updateDateActionBtn('m_date', 'm_dateActionButton');
        selectedFilterDate = dateStr;
        renderAgendaList();
    }

    function clearDateFilter() {
        selectedFilterDate = null;
        renderAgendaList();
    }

    function resetForm() {
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('type').value = 'Event';
        document.getElementById('date').value = '';
        updateDateActionBtn('date', 'dateActionButton');
        document.getElementById('priority').value = 'personal';
        document.getElementById('timeblock').value = 'none';
        handleTypeChange();
    }

    function m_resetForm() {
        document.getElementById('m_editEntryId').value = '';
        document.getElementById('m_title').value = '';
        document.getElementById('m_description').value = '';

    async function m_saveSchedule() {
        const id = document.getElementById('m_editEntryId').value;
        const rawInputTitle = document.getElementById('m_title').value;
        const description = document.getElementById('m_description').value;
        const type = document.getElementById('m_type').value;
        let dateInputVal = document.getElementById('m_date').value;
        let date = null;

        if (type === 'Habit') {
            date = null;
        } else if (dateInputVal) {
            if (type === 'Birthday') {
                let cleanVal = dateInputVal.includes('-') ? dateInputVal.split('-').slice(-2).join('-') : dateInputVal;
                date = `2000-${cleanVal}`;
            } else {
                date = dateInputVal;
            }
        }

        let priority = document.getElementById('m_priority').value;
        let timeblock = type === 'Habit' ? 'none' : document.getElementById('m_timeblock').value;
        let recurring = 'none';

        if (type === 'Birthday') {
            recurring = 'yearly';
            priority = 'personal';
            timeblock = 'none';
        }

        if (!rawInputTitle) {
            alert('title is required!');
            return;
        }

        let finalTitleToSave = rawInputTitle;

        if (id) {
            const existingItem = schedules.find(s => String(s.id) === String(id));
            if (existingItem) {
                const oldParsed = parseTodoistTitle(existingItem.title);
                const newParsed = parseTodoistTitle(rawInputTitle);

                let combinedLabels = Array.from(new Set([...oldParsed.labelTags, ...newParsed.labelTags]));
                let combinedTimes = newParsed.timeTags.length > 0 ? newParsed.timeTags : oldParsed.timeTags;

                let builtTitleParts = [newParsed.cleanTitle];
                combinedTimes.forEach(t => builtTitleParts.push(t));
                combinedLabels.forEach(l => builtTitleParts.push('.' + l));

                finalTitleToSave = builtTitleParts.join(' ');
            }

            const payload = { title: finalTitleToSave, description, type, date, priority, timeblock, recurring };
            if (type === 'Habit') {
                payload.date = null;
                payload.isHabitInstance = false;
            }

            const { error } = await supabaseClient
                .from('schedules')
                .update(payload)
                .eq('id', id);

            if (!error) {
                m_resetForm();
                closeFormModal();
                fetchSchedules();
            }
        } else {
            const newEntry = { title: finalTitleToSave, description, type, date, priority, timeblock, recurring, completed: false, isHabitInstance: false };
            const { error } = await supabaseClient.from('schedules').insert([newEntry]);
            
            if (!error) {
                m_resetForm();
                closeFormModal();
                fetchSchedules();
            }
        }
    }

    async function moveHabitOrder(id, direction, event) {
        event.stopPropagation();
        const habits = schedules.filter(s => s.type === 'Habit');
        habits.sort((a, b) => parseTodoistTitle(a.title).cleanTitle.localeCompare(parseTodoistTitle(b.title).cleanTitle));

        const index = habits.findIndex(h => String(h.id) === String(id));
        if (index === -1) return;

        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= habits.length) return;

        // Swap titles or custom ordering (since order isn't a dedicated column yet, we swap titles/identifiers or handle UI re-render)
        // To implement persistence for manual order, let's swap the titles between the two habits
        let tempTitle = habits[index].title;
        let tempDesc = habits[index].description;
        let tempPriority = habits[index].priority;

        habits[index].title = habits[targetIndex].title;
        habits[index].description = habits[targetIndex].description;
        habits[index].priority = habits[targetIndex].priority;

        habits[targetIndex].title = tempTitle;
        habits[targetIndex].description = tempDesc;
        habits[targetIndex].priority = tempPriority;

        // Update both in database
        await supabaseClient.from('schedules').update({ title: habits[index].title, description: habits[index].description, priority: habits[index].priority }).eq('id', habits[index].id);
        await supabaseClient.from('schedules').update({ title: habits[targetIndex].title, description: habits[targetIndex].description, priority: habits[targetIndex].priority }).eq('id', habits[targetIndex].id);

        await fetchSchedules();
        openDirectoryModal('habits');
    }

    async function removeTagFromItem(id, tagToRemove, event) {
        event.stopPropagation();
        const item = schedules.find(s => String(s.id) === String(id));
        if (!item) return;

        let newTitle = item.title
            .replace(new RegExp(`\\b\\.?${tagToRemove}\\b`, 'gi'), '')
            .replace(/\s+/g, ' ')
            .trim();

        const { error } = await supabaseClient.from('schedules').update({ title: newTitle }).eq('id', id);
        if (!error) {
            await fetchSchedules();
            openDetailModal(id);
        }
    }

    function openDirectoryModal(typeKey, targetParam = null) {
        const modalTitle = document.getElementById('directoryModalTitle');
        const modalContent = document.getElementById('directoryModalContent');
        const modalHeaderEl = document.getElementById('directoryModalHeader');
        const todayStr = getTodayString();

        let headerActionsHTML = '';
        if (typeKey === 'habits') {
            headerActionsHTML += `<button class="btn-order" style="margin-right: 6px; padding: 2px 6px; font-size: 10px;" onclick="toggleHabitOrderMode()">${isHabitOrderMode ? 'done ordering' : 'edit order'}</button>`;
        }
        if (typeKey === 'collections' && targetParam !== null) {
            headerActionsHTML += `<button class="btn-edit" style="margin-right: 6px; padding: 2px 6px; font-size: 10px;" onclick="openDirectoryModal('collections', null)">← back</button>`;
        }
        headerActionsHTML += `<button class="modal-close" onclick="closeDirectoryModal()">×</button>`;

        let html = '';
        if (typeKey === 'birthdays') {
            modalTitle.innerText = '🎂 birthdays directory';
            let birthdays = schedules.filter(s => s.type === 'Birthday');
            
            birthdays.sort((a, b) => {
                const getMonthDay = (dateStr) => {
                    if (!dateStr) return '12-31';
                    const parts = dateStr.split('-');
                    return parts.length >= 3 ? `${parts[1]}-${parts[2]}` : (parts.length === 2 ? `${parts[0]}-${parts[1]}` : '12-31');
                };
                return getMonthDay(a.date).localeCompare(getMonthDay(b.date));
            });

            if (birthdays.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">no birthdays recorded.</div>';
            } else {
                birthdays.forEach(s => { html += renderCardHTML(s, 'var(--birthday-strawberry)', true); });
            }
        } else if (typeKey === 'habits') {
            modalTitle.innerText = '🔁 habits directory';
            let habits = schedules.filter(s => s.type === 'Habit');
            
            // Sort habits alphabetically by title (ascending)
            habits.sort((a, b) => {
                const titleA = parseTodoistTitle(a.title).cleanTitle;
                const titleB = parseTodoistTitle(b.title).cleanTitle;
                return titleA.localeCompare(titleB);
            });

            if (habits.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">no habits recorded.</div>';
            } else {
                html += `<div class="section-category-box"><div class="section-category-title"><span>📌 all habits (alphabetical)</span><span>[${habits.length}]</span></div>`;
                habits.forEach(s => {
                    let solidBg = priorityColors[s.priority] || '#333';
                    html += renderHabitCardHTML(s, solidBg);
                });
                html += `</div>`;
            }
        } else if (typeKey === 'skipped') {
            modalTitle.innerText = '🕰️ skipped tasks';
            const skipped = schedules.filter(s => s.type === 'Task' && !s.isHabitInstance && s.date && s.date < todayStr && !s.completed);
            if (skipped.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">no skipped past tasks. clean slate!</div>';
            } else {
                skipped.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        } else if (typeKey === 'today_overflow') {
            modalTitle.innerText = '📌 today (full list)';
            const todayItems = sortItems(schedules.filter(s => s.date === todayStr));
            todayItems.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                html += renderCardHTML(s, bgStyle);
            });
        } else if (typeKey === 'upcoming_overflow') {
            modalTitle.innerText = '🚀 upcoming (full list)';
            const tomorrow = new Date(todayStr);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
            const upcomingItems = sortItems(schedules.filter(s => s.date === tomStr));
            upcomingItems.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                html += renderCardHTML(s, bgStyle);
            });
        } else if (typeKey === 'inbox_overflow') {
            modalTitle.innerText = '📥 inbox / dumplist (full list)';
            const inboxItems = sortItems(schedules.filter(s => !s.date && s.type !== 'Habit'));
            inboxItems.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                html += renderCardHTML(s, bgStyle);
            });
        } else if (typeKey === 'collections') {
            if (!targetParam) {
                modalTitle.innerText = '🏷️ labels & collections';
                let labelMap = {};
                schedules.forEach(s => {
                    const parsed = parseTodoistTitle(s.title);
                    parsed.labelTags.forEach(l => {
                        if (!labelMap[l]) labelMap[l] = [];
                        labelMap[l].push(s);
                    });
                });
                const keys = Object.keys(labelMap);
                if (keys.length === 0) {
                    html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">no labels found. use .label in title.</div>';
                } else {
                    keys.forEach(l => {
                        html += `
                            <div class="agenda-item" style="background: #141414; margin-bottom: 6px;" onclick="openDirectoryModal('collections', '${l}')">
                                <div class="agenda-content">
                                    <h4>🏷️ ${l}</h4>
                                    <p>total items: ${labelMap[l].length}</p>
                                </div>
                                <div class="agenda-actions"><span style="font-size:10px; color:#fff;">view →</span></div>
                            </div>
                        `;
                    });
                }
            } else {
                modalTitle.innerText = `🏷️ label: ${targetParam}`;
                const matched = schedules.filter(s => parseTodoistTitle(s.title).labelTags.includes(targetParam));
                matched.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        }

        modalHeaderEl.innerHTML = `<span id="directoryModalTitle">${modalTitle.innerText}</span><div style="display:flex; align-items:center;">${headerActionsHTML}</div>`;
        modalContent.innerHTML = html;
        showModal('directoryModal');

    function renderCardHTML(s, bgStyle, isBirthdayDirectory = false) {
        const itemClass = s.completed ? 'agenda-item completed-item' : 'agenda-item';
        
        let displayDate = s.date;
        if (s.type === 'Birthday' && s.date && s.date.includes('-')) {
            const parts = s.date.split('-');
            if (parts.length === 3) displayDate = `${parts[2]}/${parts[1]}`;
        } else {
            displayDate = formatDateDDMM(s.date);
        }

        let tagDisplay = isBirthdayDirectory ? displayDate : (s.type === 'Birthday' ? displayDate : `${displayDate} | ${s.priority} / ${s.timeblock || 'none'}`);

        const parsed = parseTodoistTitle(s.title);
        let pillsHTML = '';
        parsed.timeTags.forEach(t => { pillsHTML += `<span class="discord-pill time-pill">⏱️ ${t}</span>`; });
        parsed.labelTags.forEach(l => { pillsHTML += `<span class="discord-pill label-pill">${l}</span>`; });

        let descHTML = (s.description && s.description.trim() !== '') ? `<p>💬 ${s.description}</p>` : '';

        let typePrefix = `[${s.type}]`;
        let finalCardBg = bgStyle;

        if (s.isHabitInstance) {
            typePrefix = '[habit]';
            finalCardBg = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
        } else if (s.type === 'Habit') {
            typePrefix = '[habit]';
        }

        return `
            <div class="${itemClass}" style="background: ${finalCardBg}; margin-bottom: 6px;" onclick="openDetailModal('${s.id}')">
                <div class="agenda-content">
                    <h4>${typePrefix} ${parsed.cleanTitle}</h4>
                    ${descHTML}
                    <p>🏷️ ${tagDisplay}</p>
                    ${pillsHTML ? `<div class="pill-badges-wrap">${pillsHTML}</div>` : ''}
                </div>
                <div class="agenda-actions">
                    ${s.type === 'Task' ? `<input type="checkbox" ${s.completed ? 'checked' : ''} onclick="toggleComplete('${s.id}', event)">` : ''}
                    <button class="btn-edit" onclick="editSchedule('${s.id}'); event.stopPropagation();">edit</button>
                    <button class="btn-delete" onclick="deleteSchedule('${s.id}', event)">x</button>
                </div>
            </div>
        `;
    }

    function renderHabitCardHTML(s, solidBg) {
        const parsed = parseTodoistTitle(s.title);
        let pillsHTML = '';
        parsed.labelTags.forEach(l => { pillsHTML += `<span class="discord-pill label-pill">${l}</span>`; });
        let descHTML = (s.description && s.description.trim() !== '') ? `<p>💬 ${s.description}</p>` : '';

        let actionButtonsHTML = '';
        if (isHabitOrderMode) {
            actionButtonsHTML = `
                <button class="btn-order" onclick="moveHabitOrder('${s.id}', -1, event)">▲</button>
                <button class="btn-order" onclick="moveHabitOrder('${s.id}', 1, event)">▼</button>
            `;
        } else {
            actionButtonsHTML = `
                <button class="btn-assign" onclick="openAssignModal('${s.id}', event)">assign</button>
                <button class="btn-edit" onclick="editSchedule('${s.id}'); event.stopPropagation();">edit</button>
                <button class="btn-delete" onclick="deleteSchedule('${s.id}', event)">x</button>
            `;
        }

        return `
            <div class="agenda-item" style="background: ${solidBg}; margin-bottom: 6px;" onclick="openDetailModal('${s.id}')">
                <div class="agenda-content">
                    <h4>[habit] ${parsed.cleanTitle}</h4>
                    ${descHTML}
                    <p>🏷️ priority: ${s.priority}</p>
                    ${pillsHTML ? `<div class="pill-badges-wrap">${pillsHTML}</div>` : ''}
                </div>
                <div class="agenda-actions">
                    ${actionButtonsHTML}
                </div>
            </div>
        `;
    }

    function renderAgendaList() {
        const container = document.getElementById('agendaContainer');
        const dumplistContainer = document.getElementById('dumplistContainer');
        const todayStr = getTodayString();

        const tomorrow = new Date(todayStr);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;

        if (schedules.length === 0) {
            container.innerHTML = 'no entries recorded yet.';
            dumplistContainer.innerHTML = '';
            return;
        }

        if (selectedFilterDate) {
            document.getElementById('clearFilterBtn').style.display = 'inline-block';
            let filteredItems = sortItems(schedules.filter(s => s.date === selectedFilterDate));
            
            if (filteredItems.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 10px;">no entries for ${formatDateDDMM(selectedFilterDate)}.</div>`;
            } else {
                let html = `<div class="section-category-box"><div class="section-category-title"><span>📅 filtered date: ${formatDateDDMM(selectedFilterDate)}</span><span>[${filteredItems.length}]</span></div>`;
                filteredItems.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    html += renderCardHTML(s, bgStyle);
                });
                html += `</div>`;
                container.innerHTML = html;
            }
            dumplistContainer.innerHTML = '';
        } else {
            document.getElementById('clearFilterBtn').style.display = 'none';
            
            let htmlMain = '';

            const todayItems = sortItems(schedules.filter(s => s.date === todayStr));
            if (todayItems.length > 0) {
                htmlMain += `<div class="section-category-box"><div class="section-category-title"><span>📌 today (${formatDateDDMM(todayStr)})</span><span>[${todayItems.length}]</span></div>`;
                const displayToday = todayItems.slice(0, 5);
                displayToday.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    htmlMain += renderCardHTML(s, bgStyle);
                });
                if (todayItems.length > 5) {
                    htmlMain += `<button class="btn-overflow-more" onclick="openDirectoryModal('today_overflow')">+ ${todayItems.length - 5} more items in today...</button>`;
                }
                htmlMain += `</div>`;
            }

            const upcomingItems = sortItems(schedules.filter(s => s.date === tomStr));
            if (upcomingItems.length > 0) {
                htmlMain += `<div class="section-category-box"><div class="section-category-title"><span>🚀 upcoming (${formatDateDDMM(tomStr)})</span><span>[${upcomingItems.length}]</span></div>`;
                const displayUpcoming = upcomingItems.slice(0, 5);
                displayUpcoming.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock || 'none'] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    htmlMain += renderCardHTML(s, bgStyle);
                });
                if (upcomingItems.length > 5) {
                    htmlMain += `<button class="btn-overflow-more" onclick="openDirectoryModal('upcoming_overflow')">+ ${upcomingItems.length - 5} more upcoming items...</button>`;
                }
                htmlMain += `</div>`;
            }

            if (!htmlMain) {
                htmlMain = `<div style="text-align: center; padding: 12px; font-style: italic; color: var(--muted-gray);">no tasks scheduled for today or tomorrow. click any date on calendar.</div>`;
            }
            container.innerHTML = htmlMain;

            const inboxItems = sortItems(schedules.filter(s => !s.date && s.type !== 'Habit'));
            if (inboxItems.length > 0) {
                let inboxHTML = `<div class="dumplist-box"><div class="dumplist-title"><span>📥 inbox / dumplist</span><span>[${inboxItems.length}]</span></div>`;
                const displayInbox = inboxItems.slice(0, 5);
                displayInbox.forEach(s => {
                    // Dumplist card background: gradient from priority color to slate grey (none)
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors['none']})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    
                    const itemClass = s.completed ? 'agenda-item completed-item' : 'agenda-item';
                    let displayDate = s.date ? formatDateDDMM(s.date) : 'inbox';
                    let tagDisplay = `${displayDate} | ${s.priority} / none`;
                    const parsed = parseTodoistTitle(s.title);
                    let pillsHTML = '';
                    parsed.timeTags.forEach(t => { pillsHTML += `<span class="discord-pill time-pill">⏱️ ${t}</span>`; });
                    parsed.labelTags.forEach(l => { pillsHTML += `<span class="discord-pill label-pill">${l}</span>`; });
                    let descHTML = (s.description && s.description.trim() !== '') ? `<p>💬 ${s.description}</p>` : '';

                    inboxHTML += `
                        <div class="${itemClass}" style="background: ${bgStyle}; margin-bottom: 6px;" onclick="openDetailModal('${s.id}')">
                            <div class="agenda-content">
                                <h4>[${s.type}] ${parsed.cleanTitle}</h4>
                                ${descHTML}
                                <p>🏷️ ${tagDisplay}</p>
                                ${pillsHTML ? `<div class="pill-badges-wrap">${pillsHTML}</div>` : ''}
                            </div>
                            <div class="agenda-actions">
                                <button class="btn-assign" onclick="openAssignModal('${s.id}', event)">assign</button>
                                ${s.type === 'Task' ? `<input type="checkbox" ${s.completed ? 'checked' : ''} onclick="toggleComplete('${s.id}', event)">` : ''}
                                <button class="btn-edit" onclick="editSchedule('${s.id}'); event.stopPropagation();">edit</button>
                                <button class="btn-delete" onclick="deleteSchedule('${s.id}', event)">x</button>
                            </div>
                        </div>
                    `;
                });
                if (inboxItems.length > 5) {
                    inboxHTML += `<button class="btn-overflow-more" onclick="openDirectoryModal('inbox_overflow')">+ ${inboxItems.length - 5} more inbox items...</button>`;
                }
                inboxHTML += `</div>`;
                dumplistContainer.innerHTML = inboxHTML;
            } else {
                dumplistContainer.innerHTML = '';
            }
        }
    }

    if (window.innerWidth >= 1100) {
        document.getElementById('formSectionContainer').style.display = 'block';
    }

    checkAuthAndInit();
</script>

</body>
</html>
