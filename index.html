<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yorushika Calendar // ヨルシカ</title>
    <!-- Favicon Yorushika -->
    <link rel="icon" type="image/png" href="https://yorushika.com/static/yorushika/official/feature/tour2022/images/ph_logo_PGWx6f7Q.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            /* 
              PENGATURAN GAYA GEN Z (HUMBLE & CHILL):
              Ubah jadi true jika ingin huruf kecil semua (lowercase) & hilangkan spasi renggang.
            */
            --forceLowercase: false;
            --cleanSpacing: false;

            --main-font: 'JetBrains Mono', monospace;
            --bg-pure: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --text-main: #e6e6e6;
            --muted-gray: #737373;
            --birthday-strawberry: #ff4d6d;
        }
        
        body, input, select, textarea, button {
            font-family: var(--main-font);
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            text-transform: uppercase;
        }

        /* KELAS OTONOM UNTUK MODE HUMBLE / GEN Z */
        body.humble-lower {
            text-transform: lowercase !important;
        }
        body.humble-lower input, 
        body.humble-lower select, 
        body.humble-lower textarea, 
        body.humble-lower option,
        body.humble-lower .agenda-content h4,
        body.humble-lower .agenda-content p,
        body.humble-lower .modal-body,
        body.humble-lower .modal-body strong {
            text-transform: lowercase !important;
        }

        body.humble-spacing .jp-title-logo,
        body.humble-spacing .sub-tag,
        body.humble-spacing h2,
        body.humble-spacing .calendar-nav h3,
        body.humble-spacing .form-section h4,
        body.humble-spacing .agenda-list h4,
        body.humble-spacing .footer-tag {
            letter-spacing: 0px !important;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 2px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @media (min-width: 1100px) {
            .container {
                max-width: 1450px;
                display: grid;
                grid-template-columns: 420px 1fr 380px;
                grid-template-rows: auto auto auto;
                gap: 20px;
                align-items: start;
            }
            .desktop-full-span { grid-column: span 3; }
            .desktop-agenda-column { grid-column: 1; grid-row: 2 / span 2; }
            .desktop-calendar-column { grid-column: 2; grid-row: 2 / span 2; }
            .desktop-form-column { grid-column: 3; grid-row: 2 / span 2; margin-top: 0 !important; }
        }
        
        #dbStatus {
            font-size: 12px;
            text-align: center;
            padding: 5px;
            border: 1px dashed var(--border-color);
            background: #000;
        }
        
        .yorushika-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }
        .eye-logo-svg {
            width: 70px;
            height: 35px;
            fill: #ffffff;
            margin-bottom: 6px;
        }
        .jp-title-logo {
            font-size: 24px;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0;
        }
        .sub-tag {
            font-size: 9px;
            color: var(--muted-gray);
            letter-spacing: 2px;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            font-size: 22px;
            letter-spacing: 3px;
            margin: 0 0 10px 0; 
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }
        
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #000000;
            padding: 8px;
            border: 1px solid var(--border-color);
        }
        .calendar-nav h3 {
            font-size: 16px;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
        }
        .calendar-nav button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .calendar-nav button:hover { background: #ffffff; color: #000000; }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            color: var(--muted-gray);
            margin-bottom: 4px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            height: 75px; 
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 1px;
            padding: 3px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .day-cell:hover { border-color: #ffffff; background: #111111; }
        .day-cell.today {
            border: 1px solid #ffffff;
            background: #141414;
        }
        .day-cell.today .day-number {
            color: #ffffff;
            text-decoration: underline;
        }
        .day-number { font-weight: bold; color: var(--muted-gray); font-size: 13px; }
        
        .badges-container {
            max-height: 45px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .mini-badge {
            font-size: 8px;
            color: #ffffff;
            padding: 1px 3px;
            border-radius: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .mini-badge.completed-badge {
            opacity: 0.25;
            text-decoration: line-through;
        }

        .form-section {
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
        }
        .form-section h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 9px; color: var(--muted-gray); }
        input, select, textarea {
            width: 100%;
            padding: 7px;
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 2px;
            box-sizing: border-box;
            font-size: 11px;
            text-transform: uppercase;
        }
        select option { text-transform: uppercase; }
        textarea { resize: vertical; min-height: 50px; white-space: pre-wrap; }
        input:focus, select:focus, textarea:focus { outline: 1px solid #ffffff; }
        
        .form-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-submit {
            flex: 2;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-reset {
            flex: 1;
            background: #1a1a1a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .agenda-list { 
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            margin-bottom: 12px;
        }
        .agenda-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }
        .agenda-list h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
        }
        .agenda-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .sort-select {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
            width: auto;
        }
        .btn-clear-filter {
            background: #1a1a1a;
            color: #ff5555;
            border: 1px solid var(--border-color);
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
        }
        .btn-clear-filter:hover { background: #ff5555; color: #fff; }

        .archive-windows-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        .btn-window-trigger {
            background: #141414;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            font-size: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .btn-window-trigger:hover { background: #ffffff; color: #000000; }

        .dumplist-box {
            background: #080808;
            border: 1px dashed var(--border-color);
            padding: 8px;
            margin-bottom: 8px;
        }
        .dumplist-title {
            font-size: 12px;
            color: var(--muted-gray);
            margin-bottom: 6px;
            border-bottom: 1px dotted var(--border-color);
            padding-bottom: 2px;
        }

        .section-category-box {
            background: #060606;
            border: 1px solid var(--border-color);
            padding: 8px;
            margin-bottom: 8px;
        }
        .section-category-title {
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        
        .agenda-item {
            padding: 8px;
            border-radius: 2px;
            margin-bottom: 5px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
        }
        .agenda-item:hover { border-color: #ffffff; }
        
        .agenda-item.completed-item {
            opacity: 0.35 !important; 
            border-style: dashed;
        }
        .agenda-item.completed-item .agenda-content h4,
        .agenda-item.completed-item .agenda-content p {
            text-decoration: line-through !important;
        }
        
        .agenda-content {
            flex-grow: 1;
            overflow: hidden;
            padding-right: 8px;
        }
        .agenda-content h4 { 
            margin: 0; 
            font-size: 11px; 
            font-weight: 600; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            text-transform: uppercase; 
        }
        .agenda-content p { 
            margin: 2px 0 0 0; 
            font-size: 9px; 
            opacity: 0.85; 
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: normal;
            word-break: break-all;
            text-transform: uppercase; 
        }
        
        .agenda-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .agenda-actions input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
        .btn-edit {
            background: rgba(0, 0, 0, 0.6);
            color: #55ff55;
            border: 1px solid #55ff55;
            padding: 3px 6px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-edit:hover { background: #55ff55; color: black; }
        .btn-delete {
            background: rgba(0, 0, 0, 0.6);
            color: #ff5555;
            border: 1px solid #ff5555;
            padding: 3px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-delete:hover { background: #ff5555; color: white; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-card {
            background: #0d0d0d;
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
        }
        .modal-header {
            font-size: 15px;
            color: #fff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-scroll-body {
            overflow-y: auto;
            max-height: calc(80vh - 60px);
            padding-right: 4px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-body p {
            margin: 6px 0;
            font-size: 11px;
            white-space: pre-wrap;
            text-transform: uppercase;
        }
        .modal-body strong {
            color: var(--muted-gray);
            font-size: 9px;
            display: block;
            text-transform: uppercase;
        }

        .footer-tag {
            text-align: center;
            font-size: 11px;
            color: var(--muted-gray);
            margin-top: 10px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="yorushika-header desktop-full-span">
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <p class="jp-title-logo">ヨルシカ</p>
        <span class="sub-tag">Music & Schedule Archive</span>
    </div>
    
    <div class="desktop-calendar-column">
        <h2>Calendar</h2>
        <div class="calendar-nav">
            <button onclick="changeMonth(-1)">◀</button>
            <h3 id="monthYearDisplay"></h3>
            <button onclick="changeMonth(1)">▶</button>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="form-section desktop-form-column">
        <h4 id="formTitleHeader">+ Create Entry</h4>
        <input type="hidden" id="editEntryId">
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g., Spring Thief / Plagiarism">
        </div>
        <div class="form-group">
            <label>Description / Note (Optional)</label>
            <textarea id="description" placeholder="Short detail or sub-note..."></textarea>
        </div>
        <div class="form-group">
            <label>Type</label>
            <select id="type" onchange="handleTypeChange()">
                <option value="Event">Event</option>
                <option value="Task">Task (With checkmark)</option>
                <option value="Birthday">Birthday (Recurring Yearly)</option>
            </select>
        </div>
        <div class="form-group">
            <label id="dateLabel">Date (Leave blank for Inbox)</label>
            <input type="date" id="date">
        </div>
        <div class="form-group" id="priorityGroup">
            <label>Priority Tagging</label>
            <select id="priority">
                <option value="personal">Personal (Mint Green)</option>
                <option value="professional">Professional (Maroon)</option>
                <option value="daily">Daily (Ink Charcoal)</option>
            </select>
        </div>
        <div class="form-group" id="timeblockGroup">
            <label>Timeblock Tagging</label>
            <select id="timeblock">
                <option value="morning">3am - 9am (Golden Dawn)</option>
                <option value="work">9am - 5pm (Summer Canopy / Olive)</option>
                <option value="night">5pm - 10pm (Japanese Indigo)</option>
            </select>
        </div>
        <div class="form-buttons">
            <button class="btn-reset" onclick="resetForm()">Reset</button>
            <button class="btn-submit" id="submitBtn" onclick="saveSchedule()">Save Entry</button>
        </div>
    </div>

    <div class="desktop-agenda-column">
        <div class="agenda-list">
            <div class="agenda-header-row">
                <h4>📋 Schedule Archive</h4>
                <div class="agenda-controls">
                    <select id="sortBySelect" class="sort-select" onchange="renderAgendaList()">
                        <option value="timeblock">Sort: Timeblock</option>
                        <option value="priority">Sort: Priority</option>
                        <option value="type">Sort: Type</option>
                    </select>
                    <button id="clearFilterBtn" class="btn-clear-filter" style="display:none;" onclick="clearDateFilter()">Show All</button>
                </div>
            </div>

            <div class="archive-windows-nav">
                <button class="btn-window-trigger" onclick="openDirectoryModal('birthdays')">🎂 Birthdays List</button>
                <button class="btn-window-trigger" onclick="openDirectoryModal('skipped')">🕰️ Skipped Tasks</button>
            </div>

            <div id="dumplistContainer"></div>
            <div id="agendaContainer" style="font-size: 11px; color: var(--muted-gray);">No entries recorded yet.</div>
        </div>
    </div>

    <div id="dbStatus" class="desktop-full-span">Menghubungkan ke Supabase Cloud...</div>

    <div class="footer-tag desktop-full-span">
        <span>― 夜을歩く者のための記録 ―</span>
    </div>
</div>

<div class="modal-overlay" id="detailModal" onclick="closeModal(event, 'detailModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalTitleText">Entry Detail</span>
            <button class="modal-close" onclick="closeDetailModal()">×</button>
        </div>
        <div class="modal-scroll-body">
            <div class="modal-body" id="modalBodyContent"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="directoryModal" onclick="closeModal(event, 'directoryModal')">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="directoryModalTitle">Directory</span>
            <button class="modal-close" onclick="closeDirectoryModal()">×</button>
        </div>
        <div class="modal-scroll-body">
            <div id="directoryModalContent" style="font-size: 11px;"></div>
        </div>
    </div>
</div>

<script>
    /* =========================================================
       PENGATURAN HUMBLE & CHILL (GEN Z MODE)
       Ubah variabel di bawah ini menjadi `true` jika ingin diaktifkan:
       - forceLowercase: true  -> Semua teks otomatis huruf kecil
       - cleanSpacing: true    -> Menghilangkan jarak renggang (letter-spacing: 0)
    ========================================================= */
    const HUMBLE_CONFIG = {
        forceLowercase: false,
        cleanSpacing: false
    };

    // Eksekusi otomatis ke HTML Body berdasarkan config di atas
    if (HUMBLE_CONFIG.forceLowercase) {
        document.body.classList.add('humble-lower');
    }
    if (HUMBLE_CONFIG.cleanSpacing) {
        document.body.classList.add('humble-spacing');
    }

    const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_u01IYdkiCB_VnoKYvcBzww_U3-cTiM8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let schedules = [];
    let selectedFilterDate = null;

    const priorityColors = { personal: '#7a9c72', professional: '#800020', daily: '#3b3b3b' };
    const timeblockColors = { morning: '#8c6d36', work: '#4f5d2f', night: '#1b263b' };
    const timeblockOrder = { morning: 1, work: 2, night: 3 };

    let currentDate = new Date();

    function handleTypeChange() {
        const typeVal = document.getElementById('type').value;
        const priorityGrp = document.getElementById('priorityGroup');
        const timeblockGrp = document.getElementById('timeblockGroup');
        const dateLbl = document.getElementById('dateLabel');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateLbl.innerText = 'Date (Month & Day - Recurring Yearly)';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateLbl.innerText = 'Date (Leave blank for Inbox)';
        }
    }

    async function fetchSchedules() {
        const { data, error } = await supabaseClient
            .from('schedules')
            .select('*')
            .order('date', { ascending: true, nullsFirst: false });

        const statusEl = document.getElementById('dbStatus');
        if (error) {
            statusEl.innerText = '⚠️ Gagal terhubung ke Cloud (Offline Mode)';
            statusEl.style.color = '#ff5555';
            schedules = JSON.parse(localStorage.getItem('yorushika_schedules')) || [];
        } else {
            statusEl.innerText = '☁️ Terhubung ke Supabase Cloud (Live)';
            statusEl.style.color = '#55ff55';
            schedules = data || [];
            localStorage.setItem('yorushika_schedules', JSON.stringify(schedules));
        }
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let monthText = monthNames[month];
        if (HUMBLE_CONFIG.forceLowercase) monthText = monthText.toLowerCase();

        document.getElementById('monthYearDisplay').innerText = `${monthText} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        let gridHTML = '';
        for (let i = 0; i < firstDayIndex; i++) {
            gridHTML += `<div class="day-cell" style="background: transparent; border-color: transparent; cursor: default;"></div>`;
        }

        const todayStr = new Date().toISOString().split('T')[0];

        for (let day = 1; day <= totalDays; day++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

            let daySchedules = schedules.filter(s => {
                if (!s.date) return false;
                if (s.date === dateStr) return true;
                if (s.type === 'Birthday' || s.recurring === 'yearly') {
                    const bMonth = s.date.split('-')[1];
                    const bDay = s.date.split('-')[2];
                    return bMonth === formattedMonth && bDay === formattedDay;
                }
                return false;
            });

            daySchedules.sort((a, b) => (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2));

            let badgesHTML = '';
            daySchedules.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                if (s.type === 'Birthday') {
                    bgStyle = `var(--birthday-strawberry)`;
                }
                const isPast = s.date && s.date < todayStr;
                const completedClass = (s.completed && isPast) ? 'completed-badge' : (s.completed && s.type === 'Task' ? 'completed-badge' : '');
                let badgeTitle = s.title;
                if (HUMBLE_CONFIG.forceLowercase) badgeTitle = badgeTitle.toLowerCase();
                badgesHTML += `<div class="mini-badge ${completedClass}" style="background: ${bgStyle};">${badgeTitle}</div>`;
            });

            const isToday = (dateStr === todayStr) ? 'today' : '';
            gridHTML += `
                <div class="day-cell ${isToday}" onclick="handleGridCellClick('${dateStr}')">
                    <span class="day-number">${day}</span>
                    <div class="badges-container">${badgesHTML}</div>
                </div>
            `;
        }

        document.getElementById('daysGrid').innerHTML = gridHTML;
        renderAgendaList();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    function handleGridCellClick(dateStr) {
        document.getElementById('date').value = dateStr;
        selectedFilterDate = dateStr;
        renderAgendaList();
    }

    function clearDateFilter() {
        selectedFilterDate = null;
        renderAgendaList();
    }

    function resetForm() {
        document.getElementById('editEntryId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        document.getElementById('type').value = 'Event';
        document.getElementById('date').value = '';
        document.getElementById('priority').value = 'personal';
        document.getElementById('timeblock').value = 'morning';
        handleTypeChange();
        document.getElementById('formTitleHeader').innerText = '+ Create Entry';
        document.getElementById('submitBtn').innerText = 'Save Entry';
    }

    async function saveSchedule() {
        const id = document.getElementById('editEntryId').value;
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const type = document.getElementById('type').value;
        let date = document.getElementById('date').value;
        if (!date) date = null;

        let priority = document.getElementById('priority').value;
        let timeblock = document.getElementById('timeblock').value;
        let recurring = 'none';

        if (type === 'Birthday') {
            recurring = 'yearly';
            priority = 'personal';
            timeblock = 'morning';
        }

        if (!title) {
            alert('Title is required!');
            return;
        }

        if (id) {
            const { error } = await supabaseClient
                .from('schedules')
                .update({ title, description, type, date, priority, timeblock, recurring })
                .eq('id', id);

            if (!error) {
                resetForm();
                fetchSchedules();
            }
        } else {
            const newEntry = { title, description, type, date, priority, timeblock, recurring, completed: false };
            const { error } = await supabaseClient.from('schedules').insert([newEntry]);
            
            if (!error) {
                resetForm();
                fetchSchedules();
            }
        }
    }

    function editSchedule(id) {
        const item = schedules.find(s => String(s.id) === String(id));
        if (item) {
            document.getElementById('editEntryId').value = item.id;
            document.getElementById('title').value = item.title;
            document.getElementById('description').value = item.description || '';
            document.getElementById('type').value = item.type;
            document.getElementById('date').value = item.date || '';
            document.getElementById('priority').value = item.priority;
            document.getElementById('timeblock').value = item.timeblock;
            
            handleTypeChange();
            document.getElementById('formTitleHeader').innerText = '✎ Edit / Reschedule';
            document.getElementById('submitBtn').innerText = 'Update Entry';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    async function toggleComplete(id, event) {
        event.stopPropagation();
        const item = schedules.find(s => String(s.id) === String(id));
        if (item) {
            const newStatus = !item.completed;
            const { error } = await supabaseClient.from('schedules').update({ completed: newStatus }).eq('id', id);
            if (!error) fetchSchedules();
        }
    }

    async function deleteSchedule(id, event) {
        event.stopPropagation();
        if (confirm('Delete this entry?')) {
            const { error } = await supabaseClient.from('schedules').delete().eq('id', id);
            if (!error) fetchSchedules();
        }
    }

    function openDetailModal(id) {
        const item = schedules.find(s => String(s.id) === String(id));
        if (!item) return;

        let modalTitle = `[${item.type}] ${item.title}`;
        let itemType = item.type;
        let itemDesc = item.description ? item.description : '-';
        let itemPriority = item.type === 'Birthday' ? 'Birthday (Strawberry)' : item.priority;
        let itemTimeblock = item.type === 'Birthday' ? 'All Day' : item.timeblock;
        let itemStatus = item.completed ? 'Completed' : 'Pending';

        if (HUMBLE_CONFIG.forceLowercase) {
            modalTitle = modalTitle.toLowerCase();
            itemType = itemType.toLowerCase();
            itemDesc = itemDesc.toLowerCase();
            itemPriority = itemPriority.toLowerCase();
            itemTimeblock = itemTimeblock.toLowerCase();
            itemStatus = itemStatus.toLowerCase();
        }

        document.getElementById('modalTitleText').innerText = modalTitle;
        const modalBody = document.getElementById('modalBodyContent');
        modalBody.innerHTML = `
            <p><strong>Date</strong> ${item.date ? item.date : 'Inbox (No Date)'}</p>
            <p><strong>Description / Note</strong> ${itemDesc}</p>
            <p><strong>Priority Tag</strong> ${itemPriority}</p>
            <p><strong>Timeblock</strong> ${itemTimeblock}</p>
            <p><strong>Status</strong> ${itemStatus}</p>
        `;
        document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function openDirectoryModal(typeKey) {
        const modalTitle = document.getElementById('directoryModalTitle');
        const modalContent = document.getElementById('directoryModalContent');
        const todayStr = new Date().toISOString().split('T')[0];

        let html = '';
        if (typeKey === 'birthdays') {
            modalTitle.innerText = HUMBLE_CONFIG.forceLowercase ? '🎂 birthdays directory' : '🎂 BIRTHDAYS DIRECTORY';
            const birthdays = schedules.filter(s => s.type === 'Birthday');
            if (birthdays.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No birthdays recorded.</div>';
            } else {
                birthdays.forEach(s => {
                    html += renderCardHTML(s, 'var(--birthday-strawberry)');
                });
            }
        } else if (typeKey === 'skipped') {
            modalTitle.innerText = HUMBLE_CONFIG.forceLowercase ? '🕰️ skipped / past tasks' : '🕰️ SKIPPED / PAST TASKS';
            const skipped = schedules.filter(s => s.date && s.date < todayStr && !s.completed);
            if (skipped.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No skipped past tasks. Clean slate!</div>';
            } else {
                skipped.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        }
        modalContent.innerHTML = html;
        document.getElementById('directoryModal').style.display = 'flex';
    }

    function closeDirectoryModal() {
        document.getElementById('directoryModal').style.display = 'none';
    }

    function closeModal(event, modalId) {
        if (event.target.id === modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    }

    function renderCardHTML(s, bgStyle) {
        const itemClass = s.completed ? 'agenda-item completed-item' : 'agenda-item';
        let descText = s.description ? s.description : 'No additional note';
        let tagDisplay = s.type === 'Birthday' ? 'Birthday / Strawberry' : `${s.date} | ${s.priority} / ${s.timeblock}`;
        let titleText = `[${s.type}] ${s.title}`;

        if (HUMBLE_CONFIG.forceLowercase) {
            titleText = titleText.toLowerCase();
            descText = descText.toLowerCase();
            tagDisplay = tagDisplay.toLowerCase();
        }

        return `
            <div class="${itemClass}" style="background: ${bgStyle}; margin-bottom: 6px;" onclick="openDetailModal('${s.id}')">
                <div class="agenda-content">
                    <h4>${titleText}</h4>
                    <p>💬 ${descText}</p>
                    <p>🏷️ ${tagDisplay}</p>
                </div>
                <div class="agenda-actions">
                    ${s.type === 'Task' ? `<input type="checkbox" ${s.completed ? 'checked' : ''} onclick="toggleComplete('${s.id}', event)">` : ''}
                    <button class="btn-edit" onclick="editSchedule('${s.id}'); event.stopPropagation();">Edit</button>
                    <button class="btn-delete" onclick="deleteSchedule('${s.id}', event)">X</button>
                </div>
            </div>
        `;
    }

    function renderAgendaList() {
        const container = document.getElementById('agendaContainer');
        const dumplistContainer = document.getElementById('dumplistContainer');
        const todayStr = new Date().toISOString().split('T')[0];

        if (schedules.length === 0) {
            container.innerHTML = 'No entries recorded yet.';
            dumplistContainer.innerHTML = '';
            return;
        }

        const inboxItems = schedules.filter(s => !s.date);
        if (inboxItems.length > 0) {
            let inboxTitle = `📥 Inbox / Dumplist (${inboxItems.length})`;
            if (HUMBLE_CONFIG.forceLowercase) inboxTitle = inboxTitle.toLowerCase();

            let inboxHTML = `
                <div class="dumplist-box">
                    <div class="dumplist-title">${inboxTitle}</div>
            `;
            inboxItems.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                inboxHTML += renderCardHTML(s, bgStyle);
            });
            inboxHTML += `</div>`;
            dumplistContainer.innerHTML = inboxHTML;
        } else {
            dumplistContainer.innerHTML = '';
        }

        if (selectedFilterDate) {
            document.getElementById('clearFilterBtn').style.display = 'inline-block';
            let filteredItems = schedules.filter(s => s.date === selectedFilterDate);
            
            if (filteredItems.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 10px;">No entries for ${selectedFilterDate}.</div>`;
                return;
            }

            let filterTitle = `📅 Filtered Date: ${selectedFilterDate}`;
            if (HUMBLE_CONFIG.forceLowercase) filterTitle = filterTitle.toLowerCase();

            let html = `<div class="section-category-box"><div class="section-category-title"><span>${filterTitle}</span><span>[${filteredItems.length}]</span></div>`;
            filteredItems.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                html += renderCardHTML(s, bgStyle);
            });
            html += `</div>`;
            container.innerHTML = html;
            return;
        } else {
            document.getElementById('clearFilterBtn').style.display = 'none';
        }

        const todayItems = schedules.filter(s => s.date === todayStr);

        if (todayItems.length > 0) {
            todayItems.sort((a, b) => (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2));
            
            let todayTitle = `📌 TODAY (${todayStr})`;
            if (HUMBLE_CONFIG.forceLowercase) todayTitle = todayTitle.toLowerCase();

            let htmlToday = `
                <div class="section-category-box">
                    <div class="section-category-title"><span>${todayTitle}</span><span>[${todayItems.length}]</span></div>
            `;
            todayItems.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                htmlToday += renderCardHTML(s, bgStyle);
            });
            htmlToday += `</div>`;
            container.innerHTML = htmlToday;
        } else {
            container.innerHTML = `<div style="text-align: center; padding: 12px; font-style: italic; color: var(--muted-gray);">No tasks scheduled for today. Click any date on calendar to check details.</div>`;
        }
    }

    fetchSchedules();
</script>

</body>
</html>
