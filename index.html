<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yorushika Calendar // ヨルシカ</title>
    
    <!-- Favicon Standar untuk PC / Browser Desktop -->
    <link rel="icon" type="image/png" href="https://yorushika.com/static/yorushika/official/feature/tour2022/images/ph_logo_PGWx6f7Q.png">
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Yorushika%20Calendar%22%2C%22short_name%22%3A%22Yorushika%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23050505%22%2C%22theme_color%22%3A%22%23050505%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fupload.wikimedia.org%2Fwikipedia%2Fcommons%2F2%2F27%2FYorushika_Logo.jpg%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fjpeg%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
    
    <!-- Apple Touch Icon untuk iOS -->
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/2/27/Yorushika_Logo.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --main-font: 'Syne', sans-serif;
            --bg-pure: #050505;
            --card-bg: #0d0d0d;
            --border-color: #262626;
            --text-main: #e6e6e6;
            --muted-gray: #737373;
            --birthday-strawberry: #ff4d6d;
            --habit-badge-bg: #3a506b;
            --discord-badge-bg: #1e1f22;
            --discord-badge-border: #35363c;
        }
        
        body, input, select, textarea, button {
            font-family: var(--main-font);
        }

        html, body {
            width: 100%;
            overflow-x: hidden; /* Mencegah scroll horizontal liar */
            background-color: var(--bg-pure);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 12px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mencegah auto-zoom di perangkat mobile saat fokus input (minimal font 16px) */
        input, select, textarea {
            font-size: 16px !important;
        }
        /* Mengembalikan ukuran teks internal form agar tetap proporsional */
        @media (min-width: 768px) {
            input, select, textarea {
                font-size: 11px !important;
            }
        }

        /* Container Login */
        #authContainer {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 2px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            display: block;
            margin: auto;
        }

        /* Container Aplikasi Utama (Disembunyikan sebelum login) */
        #appContainer {
            display: none;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 2px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.95);
            box-sizing: border-box;
            flex-direction: column;
            gap: 16px;
            margin: auto; /* Memastikan selalu berada di tengah secara horizontal */
        }

        .auth-error {
            color: #ff5555;
            font-size: 10px;
            margin-top: 8px;
            text-align: center;
            min-height: 15px;
        }

        .btn-logout {
            background: #1a1a1a;
            color: #ff5555;
            border: 1px solid var(--border-color);
            padding: 8px;
            font-size: 10px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 2px;
        }
        .btn-logout:hover { background: #ff5555; color: #ffffff; }

        .mobile-create-trigger {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            margin-bottom: 4px;
            box-sizing: border-box;
        }
        .mobile-create-trigger:hover { background: #e0e0e0; }

        .btn-notify-trigger {
            background: var(--discord-badge-bg);
            color: #ffffff;
            border: 1px solid var(--discord-badge-border);
        }
        .btn-notify-trigger:hover {
            background: #2b2d31;
        }

        @media (min-width: 1100px) {
            #appContainer {
                max-width: 1450px;
                display: none; /* diatur via JS setelah login */
                grid-template-columns: 420px 1fr 380px;
                grid-template-rows: auto auto auto;
                gap: 20px;
                align-items: start;
                margin-left: auto;
                margin-right: auto;
            }
            .desktop-full-span { grid-column: span 3; }
            .desktop-agenda-column { grid-column: 1; grid-row: 2 / span 2; }
            .desktop-calendar-column { grid-column: 2; grid-row: 2 / span 2; }
            .desktop-form-column { grid-column: 3; grid-row: 2 / span 2; margin-top: 0 !important; display: block !important; }
            .mobile-create-trigger.btn-create-only { display: none !important; }
        }
        
        #dbStatus {
            font-size: 12px;
            text-align: center;
            padding: 5px;
            border: 1px dashed var(--border-color);
            background: #000;
        }
        
        .yorushika-header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }
        .eye-logo-svg {
            width: 70px;
            height: 35px;
            fill: #ffffff;
            margin-bottom: 6px;
        }
        .jp-title-logo {
            font-size: 24px;
            letter-spacing: 4px;
            color: #ffffff;
            margin: 0;
        }
        .sub-tag {
            font-size: 9px;
            color: var(--muted-gray);
            letter-spacing: 2px;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            font-size: 22px;
            letter-spacing: 3px;
            margin: 0 0 10px 0; 
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }
        
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #000000;
            padding: 8px;
            border: 1px solid var(--border-color);
        }
        .calendar-nav h3 {
            font-size: 16px;
            letter-spacing: 1px;
            margin: 0;
            color: #ffffff;
        }
        .calendar-nav button {
            background: #1a1a1a;
            color: white;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .calendar-nav button:hover { background: #ffffff; color: #000000; }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 10px;
            color: var(--muted-gray);
            margin-bottom: 4px;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .day-cell {
            height: 75px; 
            background: #050505;
            border: 1px solid var(--border-color);
            border-radius: 1px;
            padding: 3px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-sizing: border-box;
        }
        .day-cell:hover { border-color: #ffffff; background: #111111; }
        .day-cell.today {
            border: 1px solid #ffffff;
            background: #141414;
        }
        .day-cell.today .day-number {
            color: #ffffff;
            text-decoration: underline;
        }
        .day-number { font-weight: bold; color: var(--muted-gray); font-size: 13px; }
        
        .badges-container {
            max-height: 45px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .mini-badge {
            font-size: 8px;
            color: #ffffff;
            padding: 1px 3px;
            border-radius: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .mini-badge.completed-badge {
            opacity: 0.35;
            text-decoration: line-through;
        }

        .pill-badges-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-top: 3px;
        }
        .discord-pill {
            background: var(--discord-badge-bg);
            border: 1px solid var(--discord-badge-border);
            color: #b5bac1;
            font-size: 8px;
            padding: 1px 5px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .discord-pill.time-pill { color: #f2f3f5; border-color: #4e5058; }
        .discord-pill.label-pill { color: #dbdee1; }

        .form-section {
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            display: none;
            box-sizing: border-box;
        }
        .form-section h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 9px; color: var(--muted-gray); }
        input, select, textarea {
            width: 100%;
            padding: 7px;
            background: #0d0d0d;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 2px;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        select option { text-transform: uppercase; }
        textarea { resize: vertical; min-height: 50px; white-space: pre-wrap; }
        input:focus, select:focus, textarea:focus { outline: 1px solid #ffffff; }
        
        .form-buttons {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-submit {
            flex: 2;
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-reset {
            flex: 1;
            background: #1a1a1a;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 2px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .agenda-list { 
            background: #000000;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .agenda-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
        }
        .agenda-list h4 {
            font-size: 15px;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
        }
        .agenda-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .sort-select {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid var(--border-color);
            font-size: 11px;
            padding: 2px 4px;
            cursor: pointer;
            width: auto;
        }
        .btn-clear-filter {
            background: #1a1a1a;
            color: #ff5555;
            border: 1px solid var(--border-color);
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
        }
        .btn-clear-filter:hover { background: #ff5555; color: #fff; }

        .archive-windows-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 10px;
        }
        .btn-window-trigger {
            background: #141414;
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 2px;
            font-size: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .btn-window-trigger:hover { background: #ffffff; color: #000000; }

        .nav-counter-badge {
            background: #ffffff;
            color: #000000;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 10px;
            margin-left: 2px;
            display: inline-block;
            vertical-align: middle;
        }
        .btn-window-trigger:hover .nav-counter-badge {
            background: #000000;
            color: #ffffff;
        }
        .nav-counter-badge.red-alert {
            background: #ff4d6d;
            color: #ffffff;
        }
        .btn-window-trigger:hover .nav-counter-badge.red-alert {
            background: #ffffff;
            color: #ff4d6d;
        }

        .dumplist-box {
            background: #080808;
            border: 1px dashed var(--border-color);
            padding: 8px;
            margin-top: 10px;
        }
        .dumplist-title {
            font-size: 12px;
            color: var(--muted-gray);
            margin-bottom: 6px;
            border-bottom: 1px dotted var(--border-color);
            padding-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }

        .section-category-box {
            background: #060606;
            border: 1px solid var(--border-color);
            padding: 8px;
            margin-bottom: 8px;
        }
        .section-category-title {
            font-size: 12px;
            color: #ffffff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        
        .agenda-item {
            padding: 8px;
            border-radius: 2px;
            margin-bottom: 5px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.25);
            cursor: pointer;
            box-sizing: border-box;
        }
        .agenda-item:hover { border-color: #ffffff; }
        
        .agenda-item.completed-item {
            opacity: 0.35 !important;
            border-style: dashed;
        }
        .agenda-item.completed-item .agenda-content h4,
        .agenda-item.completed-item .agenda-content p {
            text-decoration: line-through !important;
        }
        
        .agenda-content {
            flex-grow: 1;
            overflow: hidden;
            padding-right: 8px;
        }
        .agenda-content h4 { 
            margin: 0; font-size: 11px; font-weight: 600; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; 
        }
        .agenda-content p { 
            margin: 2px 0 0 0; font-size: 9px; opacity: 0.85; 
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis; white-space: normal; word-break: break-all; text-transform: uppercase; 
        }
        
        .agenda-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .agenda-actions input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
        .btn-assign, .btn-edit, .btn-delete {
            background: rgba(0, 0, 0, 0.6);
            padding: 3px 5px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 8px;
            font-weight: bold;
        }
        .btn-assign { color: #4da6ff; border: 1px solid #4da6ff; }
        .btn-assign:hover { background: #4da6ff; color: black; }
        .btn-edit { color: #55ff55; border: 1px solid #55ff55; }
        .btn-edit:hover { background: #55ff55; color: black; }
        .btn-delete { color: #ff5555; border: 1px solid #ff5555; padding: 3px 4px; }
        .btn-delete:hover { background: #ff5555; color: white; }

        .btn-overflow-more {
            display: block;
            width: 100%;
            background: #141414;
            color: #fff;
            border: 1px dashed var(--border-color);
            padding: 5px;
            font-size: 9px;
            text-align: center;
            cursor: pointer;
            margin-top: 4px;
            box-sizing: border-box;
        }
        .btn-overflow-more:hover { background: #262626; border-color: #fff; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #0d0d0d;
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 440px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            position: relative;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            font-size: 15px;
            color: #fff;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-scroll-body {
            overflow-y: auto;
            max-height: calc(80vh - 60px);
            padding-right: 4px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
        }
        .modal-body p {
            margin: 6px 0;
            font-size: 11px;
            white-space: pre-wrap;
            text-transform: uppercase;
        }
        .modal-body strong {
            color: var(--muted-gray);
            font-size: 9px;
            display: block;
            text-transform: uppercase;
        }

        .editable-pill-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .editable-pill {
            background: #2b2d31;
            border: 1px solid #383a40;
            color: #f2f3f5;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .editable-pill .remove-pill {
            cursor: pointer;
            color: #ed4245;
            font-weight: bold;
            font-size: 10px;
        }
        .editable-pill .remove-pill:hover { color: #ff6b6b; }

        .footer-tag {
            text-align: center;
            font-size: 11px;
            color: var(--muted-gray);
            margin-top: 10px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- KOTAK LOGIN SUPABASE -->
<div id="authContainer">
    <div class="yorushika-header" style="margin-bottom: 15px;">
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <p class="jp-title-logo">ヨルシカ</p>
        <span class="sub-tag">Secure Login Required</span>
    </div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="authEmail">Email</label>
            <input type="email" id="authEmail" required placeholder="name@domain.com">
        </div>
        <div class="form-group">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" required placeholder="••••••••">
        </div>
        <div class="auth-error" id="authErrorMsg"></div>
        <button type="submit" class="mobile-create-trigger" style="margin-top: 10px;">Login System</button>
    </form>
</div>

<!-- KONTEN UTAMA APLIKASI -->
<div class="container" id="appContainer">
    <div class="yorushika-header desktop-full-span">
        <svg class="eye-logo-svg" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="50" r="38" fill="none" stroke="#ffffff" stroke-width="8"/>
            <path d="M 100 18 Q 112 50 100 82 Q 88 50 100 18 Z" fill="#ffffff"/>
            <path d="M 20 50 Q 60 20 90 32 L 90 68 Q 60 80 20 50 Z" fill="#ffffff"/>
            <path d="M 180 50 Q 140 20 110 32 L 110 68 Q 140 80 180 50 Z" fill="#ffffff"/>
        </svg>
        <p class="jp-title-logo">ヨルシカ</p>
        <span class="sub-tag">Music & Schedule Archive</span>
    </div>

    <!-- Tombol Logout di Atas -->
    <div class="desktop-full-span">
        <button class="btn-logout" onclick="handleLogout()">🔒 Logout Session</button>
    </div>
    
    <div class="desktop-calendar-column">
        <h2>Calendar</h2>
        <div class="calendar-nav">
            <button onclick="changeMonth(-1)" aria-label="Previous Month">◀</button>
            <h3 id="monthYearDisplay"></h3>
            <button onclick="changeMonth(1)" aria-label="Next Month">▶</button>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <button class="mobile-create-trigger btn-create-only desktop-full-span" onclick="openFormModal()">+ Create Entry</button>
    <button class="mobile-create-trigger btn-notify-trigger desktop-full-span" onclick="requestNotificationPermission()">🔔 Aktifkan Push Notification</button>

    <!-- Desktop Column: Form Entry -->
    <div class="form-section desktop-form-column" id="formSectionContainer">
        <h4>+ Create Entry</h4>
        <div class="form-group">

<script>
    const SUPABASE_URL = 'https://movcjscdntwckaslnumn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_u01IYdkiCB_VnoKYvcBzww_U3-cTiM8';
    
    let supabaseClient;
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true },
            db: { schema: 'public' },
            global: { headers: { 'x-client-info': 'yorushika-calendar' } }
        });
    } catch (e) {
        console.error('Supabase initialization failed:', e);
    }

    let schedules = [];
    let selectedFilterDate = null;
    let currentOpenDirectoryKey = null;
    let currentOpenDirectoryTarget = null;

    const priorityColors = { personal: '#7a9c72', professional: '#800020', daily: '#3b3b3b' };
    const timeblockColors = { morning: '#8c6d36', work: '#4f5d2f', night: '#1b263b' };
    
    const timeblockOrder = { morning: 1, work: 2, night: 3 };
    const priorityOrder = { professional: 1, daily: 2, personal: 3 };
    const typeOrder = { Task: 1, Event: 2, Habit: 3, Birthday: 4 };

    let currentDate = new Date();

    // -------------------------------------------------------------
    // AUTHENTICATION LOGIC (SUPABASE AUTH)
    // -------------------------------------------------------------
    async function checkAuthSession() {
        if (!supabaseClient) return;
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = (window.innerWidth >= 1100) ? 'grid' : 'flex';
            document.body.style.display = 'block';
            fetchSchedules();
        } else {
            document.getElementById('authContainer').style.display = 'block';
            document.getElementById('appContainer').style.display = 'none';
            document.body.style.display = 'flex';
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        const errorMsgEl = document.getElementById('authErrorMsg');

        errorMsgEl.innerText = 'Authenticating...';

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            errorMsgEl.innerText = 'Login Failed: ' + error.message;
        } else {
            errorMsgEl.innerText = '';
            document.getElementById('loginForm').reset();
            checkAuthSession();
        }
    }

    async function handleLogout() {
        if (confirm('Yakin ingin keluar sesi?')) {
            await supabaseClient.auth.signOut();
            checkAuthSession();
        }
    }

    checkAuthSession();

    function showModal(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;
        modal.style.display = 'flex';
        requestAnimationFrame(() => { modal.classList.add('active'); });
    }

    function hideModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal && modal.classList.contains('active')) {
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            ['formModal', 'assignModal', 'detailModal', 'directoryModal'].forEach(modalId => {
                const el = document.getElementById(modalId);
                if (el && el.classList.contains('active')) {
                    hideModal(modalId);
                }
            });
        }
    });

    function parseTodoistTitle(rawTitle) {
        if (!rawTitle) return { cleanTitle: '', timeTags: [], labelTags: [] };

        const timeRegex = /\b(\d{1,2}(?:\.\d{2}|:\d{2})?\s*(?:am|pm)|\d{1,2}(?:\.\d{2}|:\d{2}))\b/gi;
        const labelRegex = /\B(\.[a-zA-Z0-9_-]+)/g;

        let timeTags = [];
        let labelTags = [];

        let match;
        while ((match = timeRegex.exec(rawTitle)) !== null) {
            timeTags.push(match[1].toLowerCase());
        }
        while ((match = labelRegex.exec(rawTitle)) !== null) {
            labelTags.push(match[1].substring(1));
        }

        let cleanTitle = rawTitle.replace(timeRegex, '').replace(labelRegex, '').replace(/\s+/g, ' ').trim();

        return { cleanTitle, timeTags, labelTags };
    }

    function formatDateDDMM(dateStr) {
        if (!dateStr) return '';
        if (dateStr.includes('-')) {
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}`;
            if (parts.length === 2) return `${parts[1]}/${parts[0]}`;
        }
        return dateStr;
    }

    function handleTypeChange() {
        const typeVal = document.getElementById('type').value;
        const priorityGrp = document.getElementById('priorityGroup');
        const timeblockGrp = document.getElementById('timeblockGroup');
        const dateGrp = document.getElementById('dateGroup');
        const dateLbl = document.getElementById('dateLabel');
        const dateInput = document.getElementById('date');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'Birthday Date (DD/MM)';
            dateInput.type = 'date';
        } else if (typeVal === 'Habit') {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'none';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'Date (Leave blank for Inbox)';
            dateInput.type = 'date';
        }
    }

    function m_handleTypeChange() {
        const typeVal = document.getElementById('m_type').value;
        const priorityGrp = document.getElementById('m_priorityGroup');
        const timeblockGrp = document.getElementById('m_timeblockGroup');
        const dateGrp = document.getElementById('m_dateGroup');
        const dateLbl = document.getElementById('m_dateLabel');
        const dateInput = document.getElementById('m_date');

        if (typeVal === 'Birthday') {
            priorityGrp.style.display = 'none';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'Birthday Date (DD/MM)';
            dateInput.type = 'date';
        } else if (typeVal === 'Habit') {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'none';
            dateGrp.style.display = 'none';
        } else {
            priorityGrp.style.display = 'block';
            timeblockGrp.style.display = 'block';
            dateGrp.style.display = 'block';
            dateLbl.innerText = 'Date (Leave blank for Inbox)';
            dateInput.type = 'date';
        }
    }

    async function fetchSchedules() {
        const statusEl = document.getElementById('dbStatus');
        statusEl.innerText = 'Menghubungkan ke Supabase Cloud...';
        statusEl.style.color = '#e6e6e6';

        if (!supabaseClient) {
            statusEl.innerText = '⚠️ Supabase Client gagal dimuat (Offline Mode)';
            statusEl.style.color = '#ff5555';
            schedules = JSON.parse(localStorage.getItem('yorushika_schedules')) || [];
            updateArchiveCounters();
            renderCalendar();
            return;
        }

        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 6000);

            const { data, error } = await supabaseClient
                .from('schedules')
                .select('*')
                .order('date', { ascending: true, nullsFirst: false })
                .abortSignal(controller.signal);

            clearTimeout(timeoutId);

            if (error) throw error;

            statusEl.innerText = '☁️ Terhubung ke Supabase Cloud (Live)';
            statusEl.style.color = '#55ff55';
            schedules = data || [];
            localStorage.setItem('yorushika_schedules', JSON.stringify(schedules));
        } catch (err) {
            console.warn('Supabase fetch error/timeout:', err);
            statusEl.innerText = '⚠️ Gagal terhubung ke Cloud (Offline / Cached Mode)';
            statusEl.style.color = '#ff5555';
            schedules = JSON.parse(localStorage.getItem('yorushika_schedules')) || [];
        }

        updateArchiveCounters();
        renderCalendar();

        const directoryModalEl = document.getElementById('directoryModal');
        if (directoryModalEl && directoryModalEl.classList.contains('active')) {
            openDirectoryModal(currentOpenDirectoryKey, currentOpenDirectoryTarget, true);
        }
    }

    function updateArchiveCounters() {
        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        const birthdayCount = schedules.filter(s => s.type === 'Birthday').length;
        const habitCount = schedules.filter(s => s.type === 'Habit').length;
        const skippedCount = schedules.filter(s => s.type === 'Task' && !s.isHabitInstance && s.date && s.date < todayStr && !s.completed).length;
        
        let allLabels = new Set();
        schedules.forEach(s => {
            const parsed = parseTodoistTitle(s.title);
            parsed.labelTags.forEach(l => allLabels.add(l));
        });

        document.getElementById('birthdayBadgeCount').innerText = birthdayCount;
        document.getElementById('habitBadgeCount').innerText = habitCount;
        
        const skippedBadge = document.getElementById('skippedBadgeCount');
        skippedBadge.innerText = skippedCount;
        if (skippedCount > 0) {
            skippedBadge.classList.add('red-alert');
        } else {
            skippedBadge.classList.remove('red-alert');
        }

        document.getElementById('labelBadgeCount').innerText = allLabels.size;
    }

    function sortItems(items) {
        const sortBySelect = document.getElementById('sortBySelect');
        const sortBy = sortBySelect ? sortBySelect.value : 'timeblock';
        
        return [...items].sort((a, b) => {
            if (a.completed && !b.completed) return 1;
            if (!a.completed && b.completed) return -1;

            if (sortBy === 'priority') {
                let pDiff = (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
                if (pDiff !== 0) return pDiff;
                return (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2);
            } else if (sortBy === 'type') {
                let tDiff = (typeOrder[a.type] || 2) - (typeOrder[b.type] || 2);
                if (tDiff !== 0) return tDiff;
                let tbDiff = (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2);
                if (tbDiff !== 0) return tbDiff;
                return (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
            } else {
                let tbDiff = (timeblockOrder[a.timeblock] || 2) - (timeblockOrder[b.timeblock] || 2);
                if (tbDiff !== 0) return tbDiff;
                return (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
            }
        });
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const monthYearDisplay = document.getElementById('monthYearDisplay');
        if (monthYearDisplay) monthYearDisplay.innerText = `${monthNames[month]} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        let gridHTML = '';
        for (let i = 0; i < firstDayIndex; i++) {
            gridHTML += `<div class="day-cell" style="background: transparent; border-color: transparent; cursor: default;"></div>`;
        }

        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        for (let day = 1; day <= totalDays; day++) {
            const formattedMonth = String(month + 1).padStart(2, '0');
            const formattedDay = String(day).padStart(2, '0');
            const dateStr = `${year}-${formattedMonth}-${formattedDay}`;

            let daySchedules = schedules.filter(s => {
                if (!s.date) return false;
                if (s.date === dateStr) return true;
                if (s.type === 'Birthday' || s.recurring === 'yearly') {
                    const bMonth = s.date.split('-')[1];
                    const bDay = s.date.split('-')[2];
                    return bMonth === formattedMonth && bDay === formattedDay;
                }
                return false;
            });

            daySchedules = sortItems(daySchedules);

            let badgesHTML = '';
            daySchedules.forEach(s => {
                let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                
                const isPast = s.date && s.date < todayStr;
                const completedClass = (s.completed && isPast) ? 'completed-badge' : (s.completed && s.type === 'Task' ? 'completed-badge' : '');
                
                const parsed = parseTodoistTitle(s.title);
                badgesHTML += `<div class="mini-badge ${completedClass}" style="background: ${bgStyle};">${parsed.cleanTitle}</div>`;
            });

            const isToday = (dateStr === todayStr) ? 'today' : '';
            gridHTML += `
                <div class="day-cell ${isToday}" onclick="handleGridCellClick('${dateStr}')">
                    <span class="day-number">${day}</span>
                    <div class="badges-container">${badgesHTML}</div>
                </div>
            `;
        }

        const daysGrid = document.getElementById('daysGrid');
        if (daysGrid) daysGrid.innerHTML = gridHTML;
        renderAgendaList();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    }

    function closeFormModal() { hideModal('formModal'); }

    async function saveSchedule() {
        const rawInputTitle = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const type = document.getElementById('type').value;
        let dateInputVal = document.getElementById('date').value;
        let date = null;

        if (type === 'Habit') {
            date = null;
        } else if (dateInputVal) {
            if (type === 'Birthday') {
                let cleanVal = dateInputVal.includes('-') ? dateInputVal.split('-').slice(-2).join('-') : dateInputVal;
                date = `2000-${cleanVal}`;
            } else {
                date = dateInputVal;
            }
        }

        let priority = document.getElementById('priority').value;
        let timeblock = type === 'Habit' ? 'morning' : document.getElementById('timeblock').value;
        let recurring = 'none';

        if (type === 'Birthday') {
            recurring = 'yearly';
            priority = 'personal';
            timeblock = 'morning';
        }

        if (!rawInputTitle.trim()) {
            alert('Title is required!');
            return;
        }

        const newEntry = { title: rawInputTitle.trim(), description, type, date, priority, timeblock, recurring, completed: false, isHabitInstance: false };
        const { error } = await supabaseClient.from('schedules').insert([newEntry]);
        
        if (!error) {
            resetForm();
            fetchSchedules();
        } else {
            alert('Failed to save entry: ' + (error.message || 'Unknown error'));
        }
    }

    async function m_saveSchedule() {
        const id = document.getElementById('m_editEntryId').value;
        const rawInputTitle = document.getElementById('m_title').value;
        const description = document.getElementById('m_description').value;
        const type = document.getElementById('m_type').value;
        let dateInputVal = document.getElementById('m_date').value;
        let date = null;

        if (type === 'Habit') {
            date = null;
        } else if (dateInputVal) {
            if (type === 'Birthday') {
                let cleanVal = dateInputVal.includes('-') ? dateInputVal.split('-').slice(-2).join('-') : dateInputVal;
                date = `2000-${cleanVal}`;
            } else {
                date = dateInputVal;
            }
        }

        let priority = document.getElementById('m_priority').value;
        let timeblock = type === 'Habit' ? 'morning' : document.getElementById('m_timeblock').value;
        let recurring = 'none';

        if (type === 'Birthday') {
            recurring = 'yearly';
            priority = 'personal';
            timeblock = 'morning';
        }

        if (!rawInputTitle.trim()) {
            alert('Title is required!');
            return;
        }

        let finalTitleToSave = rawInputTitle.trim();

        if (id) {
            const existingItem = schedules.find(s => String(s.id) === String(id));
            if (existingItem) {
                const oldParsed = parseTodoistTitle(existingItem.title);
                const newParsed = parseTodoistTitle(rawInputTitle);

                let combinedLabels = Array.from(new Set([...oldParsed.labelTags, ...newParsed.labelTags]));
                let combinedTimes = newParsed.timeTags.length > 0 ? newParsed.timeTags : oldParsed.timeTags;

                let builtTitleParts = [newParsed.cleanTitle];
                combinedTimes.forEach(t => builtTitleParts.push(t));
                combinedLabels.forEach(l => builtTitleParts.push('.' + l));

                finalTitleToSave = builtTitleParts.join(' ');
            }

            const payload = { title: finalTitleToSave, description, type, date, priority, timeblock, recurring };
            if (type === 'Habit') {
                payload.date = null;
                payload.isHabitInstance = false;
            }

            const { error } = await supabaseClient
                .from('schedules')
                .update(payload)
                .eq('id', id);

            if (!error) {
                m_resetForm();
                closeFormModal();
                fetchSchedules();
            }
        } else {
            const newEntry = { title: finalTitleToSave, description, type, date, priority, timeblock, recurring, completed: false, isHabitInstance: false };
            const { error } = await supabaseClient.from('schedules').insert([newEntry]);
            
            if (!error) {
                m_resetForm();
                closeFormModal();
                fetchSchedules();
            }
        }
    }

    function editSchedule(id) {
        const item = schedules.find(s => String(s.id) === String(id));
        if (item) {
            hideModal('directoryModal');
            hideModal('detailModal');

            const parsed = parseTodoistTitle(item.title);

            document.getElementById('m_editEntryId').value = item.id;
            document.getElementById('m_title').value = parsed.cleanTitle;
            document.getElementById('m_description').value = item.description || '';
            document.getElementById('m_type').value = item.type;
            
            if (item.type === 'Birthday' && item.date && item.date.includes('-')) {
                const parts = item.date.split('-');
                document.getElementById('m_date').value = parts.length === 3 ? `2000-${parts[1]}-${parts[2]}` : item.date;
            } else {
                document.getElementById('m_date').value = item.date || '';
            }

            document.getElementById('m_priority').value = item.priority;
            document.getElementById('m_timeblock').value = item.timeblock;
            
            m_handleTypeChange();
            document.getElementById('modalFormHeaderTitle').innerText = 'Edit / Reschedule';
            document.getElementById('m_submitBtn').innerText = 'Update Entry';
            showModal('formModal');
        }
    }

    function openAssignModal(id, event) {
        event.stopPropagation();
        hideModal('directoryModal');
        document.getElementById('assignEntryId').value = id;
        
        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;
        document.getElementById('assignDate').value = todayStr;
        document.getElementById('assignTimeblock').value = 'morning';

        showModal('assignModal');
    }

    function closeAssignModal() {
        hideModal('assignModal');
    }

    async function executeAssignHabit() {
        const id = document.getElementById('assignEntryId').value;
        const targetDate = document.getElementById('assignDate').value;
        const targetTimeblock = document.getElementById('assignTimeblock').value;

        if (!targetDate) {
            alert('Please select a target date!');
            return;
        }

        const masterHabit = schedules.find(s => String(s.id) === String(id));
        if (!masterHabit) {
            alert('Habit tidak ditemukan.');
            return;
        }

        const newHabitInstance = {
            title: masterHabit.title,
            description: masterHabit.description || '',
            type: 'Task',
            date: targetDate,
            priority: masterHabit.priority,
            timeblock: targetTimeblock,
            recurring: 'none',
            isHabitInstance: true,
            completed: false
        };

        const { error } = await supabaseClient.from('schedules').insert([newHabitInstance]);

        if (!error) {
            closeAssignModal();
            fetchSchedules();
        } else {
            console.error('Supabase Error:', error);
            alert('Failed to assign habit: ' + (error.message || 'Unknown error'));
        }
    }

    async function toggleComplete(id, event) {
        event.stopPropagation();
        const item = schedules.find(s => String(s.id) === String(id));
        if (item) {
            const newStatus = !item.completed;
            const { error } = await supabaseClient.from('schedules').update({ completed: newStatus }).eq('id', id);
            if (!error) fetchSchedules();
        }
    }

    async function deleteSchedule(id, event) {
        event.stopPropagation();
        if (confirm('Delete this entry?')) {
            const { error } = await supabaseClient.from('schedules').delete().eq('id', id);
            if (!error) fetchSchedules();
        }
    }

    async function removeTagFromItem(id, tagToRemove, event) {
        event.stopPropagation();
        const item = schedules.find(s => String(s.id) === String(id));
        if (!item) return;

        let newTitle = item.title
            .replace(new RegExp(`\\b\\.?${tagToRemove}\\b`, 'gi'), '')
            .replace(/\s+/g, ' ')
            .trim();

        const { error } = await supabaseClient.from('schedules').update({ title: newTitle }).eq('id', id);
        if (!error) {
            await fetchSchedules();
            openDetailModal(id);
        }
    }

    function openDetailModal(id) {
        hideModal('directoryModal');

        const item = schedules.find(s => String(s.id) === String(id));
        if (!item) return;

        const parsed = parseTodoistTitle(item.title);
        let itemDesc = item.description ? item.description : '-';
        let itemPriority = item.type === 'Birthday' ? 'Birthday' : item.priority;
        let itemTimeblock = (item.type === 'Birthday' || item.type === 'Habit') ? 'N/A' : item.timeblock;
        let itemStatus = item.completed ? 'Completed' : 'Pending';

        let displayDate = item.date;
        if (item.type === 'Birthday' && item.date && item.date.includes('-')) {
            const parts = item.date.split('-');
            if (parts.length === 3) displayDate = `${parts[2]}/${parts[1]}`;
        } else {
            displayDate = formatDateDDMM(item.date);
        }

        let pillHTML = '';
        if (parsed.timeTags.length > 0) {
            parsed.timeTags.forEach(t => { 
                pillHTML += `<span class="editable-pill time-pill">⏱️ ${t} <span class="remove-pill" onclick="removeTagFromItem('${item.id}', '${t}', event)" title="Remove time">×</span></span>`; 
            });
        }
        if (parsed.labelTags.length > 0) {
            parsed.labelTags.forEach(l => {
                pillHTML += `<span class="editable-pill label-pill">🏷️ ${l} <span class="remove-pill" onclick="removeTagFromItem('${item.id}', '${l}', event)" title="Remove label">×</span></span>`;
            });
        }
        if (!pillHTML) pillHTML = '<span style="color:var(--muted-gray); font-size:9px;">No tags / labels</span>';

        let detailTypeLabel = item.type;
        if (item.isHabitInstance) detailTypeLabel = 'Habit';

        document.getElementById('modalTitleText').innerText = `[${detailTypeLabel}] ${parsed.cleanTitle}`;
        document.getElementById('modalBodyContent').innerHTML = `
            <p><strong>Date</strong> ${displayDate ? displayDate : 'Habit / Master Inbox'}</p>
            <p><strong>Description / Note</strong> ${itemDesc}</p>
            <p><strong>Priority Tag</strong> ${itemPriority}</p>
            <p><strong>Timeblock</strong> ${itemTimeblock}</p>
            <p><strong>Status</strong> ${itemStatus}</p>
            <p><strong>Discord-style Badges & Labels</strong></p>
            <div class="editable-pill-container">${pillHTML}</div>
        `;
        showModal('detailModal');
    }

    function closeDetailModal() { hideModal('detailModal'); }

    function openDirectoryModal(typeKey, targetParam = null, isLiveRefresh = false) {
        if (!isLiveRefresh) {
            currentOpenDirectoryKey = typeKey;
            currentOpenDirectoryTarget = targetParam;
        }

        const modalTitle = document.getElementById('directoryModalTitle');
        const modalContent = document.getElementById('directoryModalContent');
        const modalHeaderEl = document.getElementById('directoryModalHeader');
        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        let headerActionsHTML = '';
        if (typeKey === 'collections' && targetParam !== null) {
            headerActionsHTML += `<button class="btn-edit" style="margin-right: 6px; padding: 2px 6px; font-size: 10px;" onclick="openDirectoryModal('collections', null)">← Back</button>`;
        }
        headerActionsHTML += `<button class="modal-close" onclick="closeDirectoryModal()">×</button>`;

        let html = '';
        if (typeKey === 'birthdays') {
            modalTitle.innerText = '🎂 BIRTHDAYS DIRECTORY';
            let birthdays = schedules.filter(s => s.type === 'Birthday');
            
            birthdays.sort((a, b) => {
                const getMonthDay = (dateStr) => {
                    if (!dateStr) return '12-31';
                    const parts = dateStr.split('-');
                    return parts.length >= 3 ? `${parts[1]}-${parts[2]}` : (parts.length === 2 ? `${parts[0]}-${parts[1]}` : '12-31');
                };
                return getMonthDay(a.date).localeCompare(getMonthDay(b.date));
            });

            if (birthdays.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No birthdays recorded.</div>';
            } else {
                birthdays.forEach(s => { html += renderCardHTML(s, 'var(--birthday-strawberry)', true); });
            }
        } else if (typeKey === 'habits') {
            modalTitle.innerText = '🔁 HABITS DIRECTORY';
            const habits = schedules.filter(s => s.type === 'Habit');
            if (habits.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No habits recorded.</div>';
            } else {
                const priorityGroups = [
                    { key: 'professional', label: 'Professional' },
                    { key: 'daily', label: 'Daily' },
                    { key: 'personal', label: 'Personal' }
                ];

                priorityGroups.forEach(group => {
                    const groupItems = habits.filter(h => h.priority === group.key);
                    if (groupItems.length > 0) {
                        html += `<div class="section-category-box"><div class="section-category-title"><span>📌 ${group.label} Habits</span><span>[${groupItems.length}]</span></div>`;
                        groupItems.forEach(s => {
                            let solidBg = priorityColors[s.priority] || '#333';
                            html += renderHabitCardHTML(s, solidBg);
                        });
                        html += `</div>`;
                    }
                });
            }
        } else if (typeKey === 'skipped') {
            modalTitle.innerText = '🕰️ SKIPPED TASKS';
            const skipped = sortItems(schedules.filter(s => s.type === 'Task' && !s.isHabitInstance && s.date && s.date < todayStr && !s.completed));
            if (skipped.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No skipped past tasks. Clean slate!</div>';
            } else {
                skipped.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        } else if (typeKey === 'today_overflow') {
            modalTitle.innerText = '📌 TODAY (FULL LIST)';
            const todayItems = sortItems(schedules.filter(s => s.date === todayStr));
            if (todayItems.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No entries for today.</div>';
            } else {
                todayItems.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        } else if (typeKey === 'upcoming_overflow') {
            modalTitle.innerText = '🚀 UPCOMING (FULL LIST)';
            const tomorrow = new Date(nowLocal);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
            const upcomingItems = sortItems(schedules.filter(s => s.date === tomStr));
            if (upcomingItems.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No upcoming entries.</div>';
            } else {
                upcomingItems.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        } else if (typeKey === 'inbox_overflow') {
            modalTitle.innerText = '📥 INBOX / DUMPLIST (FULL LIST)';
            const inboxItems = sortItems(schedules.filter(s => !s.date && s.type !== 'Habit'));
            if (inboxItems.length === 0) {
                html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">Inbox is empty.</div>';
            } else {
                inboxItems.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    html += renderCardHTML(s, bgStyle);
                });
            }
        } else if (typeKey === 'collections') {
            if (!targetParam) {
                modalTitle.innerText = '🏷️ LABELS & COLLECTIONS';
                let labelMap = {};
                schedules.forEach(s => {
                    const parsed = parseTodoistTitle(s.title);
                    parsed.labelTags.forEach(l => {
                        if (!labelMap[l]) labelMap[l] = [];
                        labelMap[l].push(s);
                    });
                });
                const keys = Object.keys(labelMap);
                if (keys.length === 0) {
                    html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No labels found. Use .label in title.</div>';
                } else {
                    keys.forEach(l => {
                        html += `
                            <div class="agenda-item" style="background: #141414; margin-bottom: 6px;" onclick="openDirectoryModal('collections', '${l}')">
                                <div class="agenda-content">
                                    <h4>🏷️ ${l}</h4>
                                    <p>Total items: ${labelMap[l].length}</p>
                                </div>
                                <div class="agenda-actions"><span style="font-size:10px; color:#fff;">View →</span></div>
                            </div>
                        `;
                    });
                }
            } else {
                modalTitle.innerText = `🏷️ LABEL: ${targetParam}`;
                const matched = sortItems(schedules.filter(s => parseTodoistTitle(s.title).labelTags.includes(targetParam)));
                if (matched.length === 0) {
                    html = '<div style="text-align: center; padding: 15px; color: var(--muted-gray);">No items found with this label.</div>';
                } else {
                    matched.forEach(s => {
                        let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                        if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                        if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                        if (s.isHabitInstance) bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                        html += renderCardHTML(s, bgStyle);
                    });
                }
            }
        }

        if (modalHeaderEl) modalHeaderEl.innerHTML = `<span id="directoryModalTitle">${modalTitle.innerText}</span><div style="display:flex; align-items:center;">${headerActionsHTML}</div>`;
        if (modalContent) modalContent.innerHTML = html;
        if (!isLiveRefresh) {
            showModal('directoryModal');
        }
    }

        currentOpenDirectoryTarget = null;
        hideModal('directoryModal');

    function renderCardHTML(s, bgStyle, isBirthdayDirectory = false) {
        const itemClass = s.completed ? 'agenda-item completed-item' : 'agenda-item';
        
        let displayDate = s.date;
        if (s.type === 'Birthday' && s.date && s.date.includes('-')) {
            const parts = s.date.split('-');
            if (parts.length === 3) displayDate = `${parts[2]}/${parts[1]}`;
        } else {
            displayDate = formatDateDDMM(s.date);
        }

        let tagDisplay = isBirthdayDirectory ? displayDate : (s.type === 'Birthday' ? displayDate : `${displayDate} | ${s.priority} / ${s.timeblock}`);

        const parsed = parseTodoistTitle(s.title);
        let pillsHTML = '';
        parsed.timeTags.forEach(t => { pillsHTML += `<span class="discord-pill time-pill">⏱️ ${t}</span>`; });
        parsed.labelTags.forEach(l => { pillsHTML += `<span class="discord-pill label-pill">${l}</span>`; });

        let descHTML = (s.description && s.description.trim() !== '') ? `<p>💬 ${s.description}</p>` : '';

        let typePrefix = `[${s.type}]`;
        let finalCardBg = bgStyle;

        if (s.isHabitInstance) {
            typePrefix = '[HABIT]';
            finalCardBg = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
        } else if (s.type === 'Habit') {
            typePrefix = '[HABIT]';
        }

        return `
            <div class="${itemClass}" style="background: ${finalCardBg}; margin-bottom: 6px;" onclick="openDetailModal('${s.id}')">
                <div class="agenda-content">
                    <h4>${typePrefix} ${parsed.cleanTitle}</h4>
                    ${descHTML}
                    <p>🏷️ ${tagDisplay}</p>
                    ${pillsHTML ? `<div class="pill-badges-wrap">${pillsHTML}</div>` : ''}
                </div>
                <div class="agenda-actions">
                    ${s.type === 'Task' ? `<input type="checkbox" ${s.completed ? 'checked' : ''} onclick="toggleComplete('${s.id}', event)" aria-label="Toggle task completion">` : ''}
                    <button class="btn-edit" onclick="editSchedule('${s.id}'); event.stopPropagation();">Edit</button>
                    <button class="btn-delete" onclick="deleteSchedule('${s.id}', event)">X</button>
                </div>
            </div>
        `;
    }

    function renderHabitCardHTML(s, solidBg) {
        const parsed = parseTodoistTitle(s.title);
        let pillsHTML = '';
        parsed.labelTags.forEach(l => { pillsHTML += `<span class="discord-pill label-pill">${l}</span>`; });
        let descHTML = (s.description && s.description.trim() !== '') ? `<p>💬 ${s.description}</p>` : '';

        return `
            <div class="agenda-item" style="background: ${solidBg}; margin-bottom: 6px;" onclick="openDetailModal('${s.id}')">
                <div class="agenda-content">
                    <h4>[HABIT] ${parsed.cleanTitle}</h4>
                    ${descHTML}
                    <p>🏷️ Priority: ${s.priority}</p>
                    ${pillsHTML ? `<div class="pill-badges-wrap">${pillsHTML}</div>` : ''}
                </div>
                <div class="agenda-actions">
                    <button class="btn-assign" onclick="openAssignModal('${s.id}', event)">Assign</button>
                    <button class="btn-edit" onclick="editSchedule('${s.id}'); event.stopPropagation();">Edit</button>
                    <button class="btn-delete" onclick="deleteSchedule('${s.id}', event)">X</button>
                </div>
            </div>
        `;
    }

    function renderAgendaList() {
        const container = document.getElementById('agendaContainer');
        const dumplistContainer = document.getElementById('dumplistContainer');
        const nowLocal = new Date();
        const todayStr = `${nowLocal.getFullYear()}-${String(nowLocal.getMonth() + 1).padStart(2, '0')}-${String(nowLocal.getDate()).padStart(2, '0')}`;

        const tomorrow = new Date(nowLocal);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;

        if (schedules.length === 0) {
            if (container) container.innerHTML = 'No entries recorded yet.';
            if (dumplistContainer) dumplistContainer.innerHTML = '';
            return;
        }

        if (selectedFilterDate) {
            const clearFilterBtn = document.getElementById('clearFilterBtn');
            if (clearFilterBtn) clearFilterBtn.style.display = 'inline-block';
            let filteredItems = sortItems(schedules.filter(s => s.date === selectedFilterDate));
            
            if (filteredItems.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 10px;">No entries for ${formatDateDDMM(selectedFilterDate)}.</div>`;
            } else {
                let html = `<div class="section-category-box"><div class="section-category-title"><span>📅 Filtered Date: ${formatDateDDMM(selectedFilterDate)}</span><span>[${filteredItems.length}]</span></div>`;
                filteredItems.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    html += renderCardHTML(s, bgStyle);
                });
                html += `</div>`;
                container.innerHTML = html;
            }
            if (dumplistContainer) dumplistContainer.innerHTML = '';
        } else {
            const clearFilterBtn = document.getElementById('clearFilterBtn');
            if (clearFilterBtn) clearFilterBtn.style.display = 'none';
            
            let htmlMain = '';

            const todayItems = sortItems(schedules.filter(s => s.date === todayStr));
            if (todayItems.length > 0) {
                htmlMain += `<div class="section-category-box"><div class="section-category-title"><span>📌 TODAY (${formatDateDDMM(todayStr)})</span><span>[${todayItems.length}]</span></div>`;
                const displayToday = todayItems.slice(0, 5);
                displayToday.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    htmlMain += renderCardHTML(s, bgStyle);
                });
                if (todayItems.length > 5) {
                    htmlMain += `<button class="btn-overflow-more" onclick="openDirectoryModal('today_overflow')">+ ${todayItems.length - 5} more items in Today...</button>`;
                }
                htmlMain += `</div>`;
            }

            const upcomingItems = sortItems(schedules.filter(s => s.date === tomStr));
            if (upcomingItems.length > 0) {
                htmlMain += `<div class="section-category-box"><div class="section-category-title"><span>🚀 UPCOMING (${formatDateDDMM(tomStr)})</span><span>[${upcomingItems.length}]</span></div>`;
                const displayUpcoming = upcomingItems.slice(0, 5);
                displayUpcoming.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    if (s.type === 'Habit') bgStyle = `var(--habit-badge-bg)`;
                    htmlMain += renderCardHTML(s, bgStyle);
                });
                if (upcomingItems.length > 5) {
                    htmlMain += `<button class="btn-overflow-more" onclick="openDirectoryModal('upcoming_overflow')">+ ${upcomingItems.length - 5} more upcoming items...</button>`;
                }
                htmlMain += `</div>`;
            }

            if (!htmlMain) {
                htmlMain = `<div style="text-align: center; padding: 12px; font-style: italic; color: var(--muted-gray);">No tasks scheduled for today or tomorrow. Click any date on calendar.</div>`;
            }
            if (container) container.innerHTML = htmlMain;

            const inboxItems = sortItems(schedules.filter(s => !s.date && s.type !== 'Habit'));
            if (inboxItems.length > 0) {
                let inboxHTML = `<div class="dumplist-box"><div class="dumplist-title"><span>📥 Inbox / Dumplist</span><span>[${inboxItems.length}]</span></div>`;
                const displayInbox = inboxItems.slice(0, 5);
                displayInbox.forEach(s => {
                    let bgStyle = `linear-gradient(135deg, ${priorityColors[s.priority] || '#333'}, ${timeblockColors[s.timeblock] || '#333'})`;
                    if (s.type === 'Birthday') bgStyle = `var(--birthday-strawberry)`;
                    inboxHTML += renderCardHTML(s, bgStyle);
                });
                if (inboxItems.length > 5) {
                    inboxHTML += `<button class="btn-overflow-more" onclick="openDirectoryModal('inbox_overflow')">+ ${inboxItems.length - 5} more inbox items...</button>`;
                }
                inboxHTML += `</div>`;
                if (dumplistContainer) dumplistContainer.innerHTML = inboxHTML;
            } else {
                if (dumplistContainer) dumplistContainer.innerHTML = '';
            }
        }
    }

    if (window.innerWidth >= 1100) {
        const formContainer = document.getElementById('formSectionContainer');
        if (formContainer) formContainer.style.display = 'block';
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('ServiceWorker registered with scope:', reg.scope))
                .catch(err => console.error('ServiceWorker registration failed:', err));
        });
    }

    async function requestNotificationPermission() {
        if (!('Notification' in window)) {
            alert('Browser kamu tidak mendukung Push Notification.');
            return;
        }

        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            alert('Notifikasi berhasil diaktifkan! 🎉');
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.ready.then(reg => {
                    reg.showNotification('Yorushika Calendar', {
                        body: 'Push Notification resmi diaktifkan!',
                        icon: 'https://upload.wikimedia.org/wikipedia/commons/2/27/Yorushika_Logo.jpg'
                    });
                });
            }
        } else if (permission === 'denied') {
            alert('Izin notifikasi ditolak. Kamu bisa mengubahnya di pengaturan browser.');
        }
    }
</script>

</body>
</html>
